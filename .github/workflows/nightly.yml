name: Nightly

# Rodada noturna: o que é pesado demais para cada PR (integração da API com Postgres, E2E completo nos dois projetos,
# suíte inteira do agente com o piso de cobertura, auditoria de PWA, APK do lançador e varredura da imagem). O ci.yml
# roda só o conjunto enxuto em cada PR e push; aqui roda tudo, uma vez por noite, fora do notebook do dono.
#
# Onde roda: o `schedule` só dispara a partir do arquivo que está na branch PADRÃO do repositório. Enquanto a padrão for a
# `main`, que não recebe a produção, este arquivo precisa existir lá para o horário valer; por isso o `schedule` faz o
# checkout explícito da `develop` (a produção). Em `workflow_dispatch` e no PR vale o commit da própria execução.
# O PR só dispara esta rodada quando muda este arquivo ou as listas de partes que ela usa (e confere que a rodada funciona).
#
# Falha: o job notify abre (ou comenta) a issue "Rodada noturna falhou" mencionando o dono, o mesmo canal do deploy.yml
# (a menção gera notificação e e-mail), e a primeira rodada inteira verde a comenta e a fecha. O PR não abre issue.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/nightly.yml"
      - ".github/scripts/api-partitions.json"
      - ".github/scripts/e2e-shards.json"
      - ".github/scripts/plan-matrices.sh"
      - ".github/scripts/run-api-tests.sh"
      - ".github/scripts/check-api-parts.sh"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  # No horário (schedule) o commit da execução é o da main; a produção é a develop. Vazio = o commit da própria execução.
  CHECKOUT_REF: ${{ github.event_name == 'schedule' && 'develop' || '' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api_matrix: ${{ steps.plan.outputs.api_matrix }}
      e2e_matrix: ${{ steps.plan.outputs.e2e_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      # As partes do teste da API e do E2E saem de arquivos em .github/scripts: uma fonte só para o job e para a conferência.
      - name: Montar as matrizes de api e e2e
        id: plan
        run: bash .github/scripts/plan-matrices.sh >> "$GITHUB_OUTPUT"

  # Testes da API em partes que rodam ao mesmo tempo. Quase todo o tempo (8 min dos ~9) é o projeto de integração:
  # um container de Postgres e todas as classes na mesma coleção do xUnit, ou seja, em fila. Cada parte roda um recorte
  # dele por namespace (.github/scripts/api-partitions.json); a parte "rest" é o complemento (os demais projetos de teste e
  # qualquer namespace novo) e é ela quem compila a solução inteira com avisos como erro e confere, antes de testar, que
  # as partes somam a suíte inteira. As outras compilam só o que o projeto de integração puxa: um artefato de build
  # compartilhado custaria mais (subir e baixar ~100 MB por parte) do que os ~50 s que cada parte gasta compilando.
  api:
    name: api (${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.api_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: apps/api/global.json
      # Os scripts rodam de dentro de apps/api: o global.json de lá liga o Microsoft.Testing.Platform no dotnet test.
      - name: Compilar a solução inteira (avisos como erro)
        if: matrix.name == 'rest'
        working-directory: apps/api
        run: dotnet build UniOver.slnx -warnaserror
      - name: Conferir que as partes somam a suíte inteira
        if: matrix.name == 'rest'
        run: bash .github/scripts/check-api-parts.sh
      - name: Testar com cobertura (${{ matrix.name }})
        env:
          PART: ${{ matrix.name }}
        run: bash .github/scripts/run-api-tests.sh "$PART"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-coverage-${{ matrix.name }}
          path: apps/api/TestResults/*.cobertura.xml
          if-no-files-found: error

  # E2E em partes que rodam ao mesmo tempo (na CI cada teste é uma unidade do --shard; ver playwright.config.ts): um
  # projeto do Playwright (e, portanto, um navegador) por parte, e cada projeto repartido com --shard k/n
  # (.github/scripts/e2e-shards.json; o job web do ci.yml confere que nenhum projeto ficou de fora).
  # Antes o --shard repartia os dois projetos juntos, por quantidade de testes: as duas primeiras partes caíam no
  # WebKit (iphone-12) e as duas últimas no Chromium (s23-fe), e o WebKit leva quase o dobro por teste (medido: 288 a
  # 350 s contra 165 a 196 s), então a parte mais lenta ditava o tempo de todas. Dentro de um projeto o custo por teste
  # é parecido. Cada parte instala só o navegador que usa: o apt do --with-deps (~50 s no WebKit) é o que pesa; o download
  # do navegador leva ~5 s e por isso não vale cache. O build de produção vem do webServer do próprio Playwright
  # (~8 s): um job de build à parte custaria mais do que economiza.
  e2e:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.e2e_matrix) }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Instalar o navegador do Playwright
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright install --with-deps "$BROWSER"
      # O build de produção vem do webServer do próprio Playwright (playwright.config.ts).
      - name: E2E (${{ matrix.project }}, parte ${{ matrix.shard }} de ${{ matrix.total }})
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}/${{ matrix.total }}
        run: npx playwright test --project "$PROJECT" --shard "$SHARD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-e2e-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

  # Auditoria de PWA: Lighthouse sobre o build servido pelo servidor de teste (mesma CSP da API) e, quando
  # existir, a conferência dos manifests por módulo. Constrói por conta própria e roda ao mesmo tempo que o e2e.
  audit-pwa:
    name: audit-pwa
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Build de produção
        run: npm run build
      - name: Auditar o PWA
        run: npm run audit:pwa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci
          if-no-files-found: ignore

  # Suíte inteira do agente, com o piso de cobertura do núcleo (o ci.yml roda só o subconjunto rápido, sem cobertura).
  agent-full:
    name: agent-full
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - run: uv sync --locked
      - name: Testes (suíte inteira, com cobertura)
        run: uv run pytest

  tv-launcher:
    name: tv-launcher
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/tv-launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      # O gradle-wrapper.jar é um binário no repositório: confere o hash contra os publicados pelo Gradle.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          min-wrapper-count: 1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      # Reaproveita o cache do Gradle que o deploy grava (só leitura aqui): o download pelo GitHub às vezes devolve 504.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # O SDK do Android já vem na imagem do runner.
      - name: Testes de unidade e de tela
        run: ./gradlew --no-daemon testDebugUnitTest
      # Com os segredos do repositório o release sai assinado com a chave fixa do projeto (a mesma do build local,
      # para a TV aceitar a atualização). Sem eles (PR de fora ou de robô, que não recebem segredos) cai na chave de
      # depuração do runner. O keystore é decodificado num arquivo temporário e apagado ao sair do passo.
      - name: Montar o APK de release
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.UNIOVER_TV_KEYSTORE_BASE64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.UNIOVER_TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.UNIOVER_TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.UNIOVER_TV_KEY_PASSWORD }}
        run: |
          signed=false
          if [ -n "$TV_KEYSTORE_BASE64" ]; then
            keystore="$RUNNER_TEMP/uniover-tv.p12"
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$TV_KEYSTORE_BASE64" | base64 -d > "$keystore"
            export UNIOVER_TV_STORE_FILE="$keystore" UNIOVER_TV_STORE_PASSWORD="$TV_KEYSTORE_PASSWORD"
            export UNIOVER_TV_KEY_ALIAS="$TV_KEY_ALIAS" UNIOVER_TV_KEY_PASSWORD="$TV_KEY_PASSWORD"
            signed=true
          else
            echo "::notice::Sem segredos de assinatura neste evento: release assinado com a chave de depuração."
          fi
          ./gradlew --no-daemon assembleRelease
          if [ "$signed" = true ]; then
            apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
            got="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1)"
            want="$(tr -d "[:space:]" < signing-cert.sha256)"
            echo "Certificado do APK: $got"
            test "$got" = "$want" || { echo "::error::o certificado do APK não é o da chave do projeto (signing-cert.sha256)."; exit 1; }
          fi

  image:
    name: image
    runs-on: ubuntu-latest
    # Construção da imagem, duas varreduras e geração do SBOM podem variar com o cache do runner.
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # O runner é descartável: remover o builder no fim do job leva até ~20 s (medido) e não protege nada.
          cleanup: false
      - name: Construir a imagem (sem publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: uniover:ci
          cache-from: type=gha
          # Só o push (develop e main) grava o cache. Gravar em todo PR custava ~30 s por execução (medido) e o cache de
          # um PR só serve a ele mesmo: 8,8 GB dos 10 GB do repositório eram desses blobs, expulsando os caches úteis.
          # Os PRs continuam lendo o cache que a develop gravou.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      - name: Trivy (relatório SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uniover:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"
      - name: Enviar SARIF ao code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
      - name: Trivy (falha com achado CRITICAL ou HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uniover:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: uniover:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: sbom.spdx.json
      # Em produção a API exige a string de conexão. Aqui ela aponta para um banco que não existe: além de subir,
      # prova que /health/live responde sem tocar no banco.
      - name: Subir o contêiner
        run: >-
          docker run -d --name uniover -p 10000:10000 -e PORT=10000
          -e "ConnectionStrings__Default=Host=127.0.0.1;Port=1;Database=none;Username=none;Password=none"
          uniover:ci
      - name: Esperar /health/live
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/health/live || true)
            if [ "$code" = "200" ]; then
              echo "A API respondeu 200 em /health/live."
              exit 0
            fi
            sleep 2
          done
          echo "::error::a API não respondeu 200 em /health/live em 60 segundos."
          docker logs uniover
          exit 1
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:10000
          rules_file_name: .github/zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline
      - name: Parar o contêiner
        if: always()
        run: docker rm -f uniover

  # Check único para exigir nas regras de branch: jobs pulados por caminho contam como verdes.

  # Aviso de falha: o mesmo canal do deploy.yml (uma issue com menção ao dono, escrita só por este job, sem checkout,
  # sem segredos e sem ação de terceiros). A execução de PR só prova a rodada: não abre issue.
  notify:
    name: notify
    needs: [plan, api, e2e, audit-pwa, agent-full, tv-launcher, image]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Abrir, comentar ou fechar a issue da rodada noturna
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          MENTION: ${{ vars.ALERT_MENTION || github.repository_owner }}
        run: |
          set -euo pipefail
          title="Rodada noturna falhou"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          failed=$(jq -r 'to_entries | map(select(.value.result == "failure")) | map(.key) | join(" ")' <<<"$NEEDS")
          total=$(jq 'length' <<<"$NEEDS")
          succeeded=$(jq '[to_entries[] | select(.value.result == "success")] | length' <<<"$NEEDS")
          number=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg title "$title" 'map(select(.title == $title)) | first | .number // empty')
          if [ -n "$failed" ]; then
            body="@$MENTION a rodada noturna do commit ${GITHUB_SHA:0:12} (evento $GITHUB_EVENT_NAME) falhou no(s) job(s): $failed. Execução: $run_url"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
              echo "Comentário acrescentado à issue #$number."
            else
              gh issue create --title "$title" --body "$body"
              echo "Issue aberta."
            fi
          elif [ "$succeeded" -eq "$total" ] && [ -n "$number" ]; then
            gh issue comment "$number" --body "Rodada noturna concluída com sucesso. Execução: $run_url"
            gh issue close "$number" --reason completed
            echo "Issue #$number fechada."
          else
            echo "Nada a fazer: sem falha e sem issue aberta."
          fi
