name: Contracts sync

# Gera de novo os tipos e o OpenAPI a partir de contracts/ e falha se algo versionado divergir.
on:
  pull_request:
    paths:
      - "contracts/**"
      - "apps/api/**"
      - "apps/web/src/app/core/api/**"
      - "apps/agent/src/uniover_agent/contracts/**"
      - ".github/workflows/contracts-sync.yml"
  push:
    branches: [develop, main]
    paths:
      - "contracts/**"
      - "apps/api/**"
      - "apps/web/src/app/core/api/**"
      - "apps/agent/src/uniover_agent/contracts/**"
      - ".github/workflows/contracts-sync.yml"

permissions:
  contents: read

concurrency:
  group: contracts-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: contracts-sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/api/global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
      - run: npm --prefix contracts ci
      - name: Gerar de novo e comparar
        run: npm --prefix contracts run check
