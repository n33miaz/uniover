name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      agent: ${{ steps.filter.outputs.agent }}
      contracts: ${{ steps.filter.outputs.contracts }}
      tv_launcher: ${{ steps.filter.outputs.tv_launcher }}
      image: ${{ steps.filter.outputs.image }}
      api_matrix: ${{ steps.plan.outputs.api_matrix }}
      e2e_matrix: ${{ steps.plan.outputs.e2e_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Mexer no próprio fluxo (ci.yml e .github/scripts) roda tudo que ele define: sem isso, um PR que só altera a
          # esteira passaria sem exercitar nenhuma das mudanças.
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            agent:
              - 'apps/agent/**'
              - '.github/workflows/ci.yml'
            contracts:
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            tv_launcher:
              - 'apps/tv-launcher/**'
              - 'contracts/tv-launcher/**'
              - 'VERSION'
              - '.github/workflows/ci.yml'
            image:
              - 'Dockerfile'
              - 'apps/api/**'
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
              - '.github/zap/**'
      # As partes do teste da API e do E2E saem de arquivos em .github/scripts: uma fonte só para o job e para a conferência.
      - name: Montar as matrizes de api e e2e
        id: plan
        run: bash .github/scripts/plan-matrices.sh >> "$GITHUB_OUTPUT"

  commits:
    name: commits
    # A develop é a porta de entrada; a main só recebe a develop, já checada.
    # Ficam de fora: PRs de robôs (atualização de dependências) e a volta da main para a develop depois de um
    # release, que só traz o commit de versão criado pela ferramenta de release.
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.head_ref != 'main' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conferir o padrão dos commits do PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOWED_EMAIL: ncormino@gmail.com
        run: bash .github/scripts/check-commits.sh "$BASE_SHA" "$HEAD_SHA"

  # Testes da API em partes que rodam ao mesmo tempo. Quase todo o tempo (8 min dos ~9) é o projeto de integração:
  # um container de Postgres e todas as classes na mesma coleção do xUnit, ou seja, em fila. Cada parte roda um recorte
  # dele por namespace (.github/scripts/api-partitions.json); a parte "rest" é o complemento (os demais projetos de teste e
  # qualquer namespace novo) e é ela quem compila a solução inteira com avisos como erro e confere, antes de testar, que
  # as partes somam a suíte inteira. As outras compilam só o que o projeto de integração puxa: um artefato de build
  # compartilhado custaria mais (subir e baixar ~100 MB por parte) do que os ~50 s que cada parte gasta compilando.
  api:
    name: api (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.api_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/api/global.json
      # Os scripts rodam de dentro de apps/api: o global.json de lá liga o Microsoft.Testing.Platform no dotnet test.
      - name: Compilar a solução inteira (avisos como erro)
        if: matrix.name == 'rest'
        working-directory: apps/api
        run: dotnet build UniOver.slnx -warnaserror
      - name: Conferir que as partes somam a suíte inteira
        if: matrix.name == 'rest'
        run: bash .github/scripts/check-api-parts.sh
      - name: Testar com cobertura (${{ matrix.name }})
        env:
          PART: ${{ matrix.name }}
        run: bash .github/scripts/run-api-tests.sh "$PART"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-coverage-${{ matrix.name }}
          path: apps/api/TestResults/*.cobertura.xml
          if-no-files-found: error

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Conferir que o E2E cobre todos os projetos do Playwright
        run: bash ../../.github/scripts/check-e2e-projects.sh
      - name: Lint
        run: npm run lint
      - name: Testes com cobertura
        run: npm run test:coverage
      - name: Build de produção
        run: npm run build

  # E2E em partes que rodam ao mesmo tempo (na CI cada teste é uma unidade do --shard; ver playwright.config.ts): um
  # projeto do Playwright (e, portanto, um navegador) por parte, e cada projeto repartido com --shard k/n
  # (.github/scripts/e2e-shards.json; o job web confere que nenhum projeto ficou de fora).
  # Antes o --shard repartia os dois projetos juntos, por quantidade de testes: as duas primeiras partes caíam no
  # WebKit (iphone-12) e as duas últimas no Chromium (s23-fe), e o WebKit leva quase o dobro por teste (medido: 288 a
  # 350 s contra 165 a 196 s), então a parte mais lenta ditava o tempo de todas. Dentro de um projeto o custo por teste
  # é parecido. Cada parte instala só o navegador que usa: o apt do --with-deps (~50 s no WebKit) é o que pesa; o download
  # do navegador leva ~5 s e por isso não vale cache. O build de produção vem do webServer do próprio Playwright
  # (~8 s): um job de build à parte custaria mais do que economiza.
  # Fica de fora o PR de versão do release-please: ele só muda número de versão e o mesmo código já passou
  # inteiro no PR da develop para a main e no push na main.
  e2e:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }})
    needs: changes
    if: needs.changes.outputs.web == 'true' && !startsWith(github.head_ref || '', 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.e2e_matrix) }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Instalar o navegador do Playwright
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright install --with-deps "$BROWSER"
      # O build de produção vem do webServer do próprio Playwright (playwright.config.ts).
      - name: E2E (${{ matrix.project }}, parte ${{ matrix.shard }} de ${{ matrix.total }})
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}/${{ matrix.total }}
        run: npx playwright test --project "$PROJECT" --shard "$SHARD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-e2e-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

  # Auditoria de PWA: Lighthouse sobre o build servido pelo servidor de teste (mesma CSP da API) e, quando
  # existir, a conferência dos manifests por módulo. Constrói por conta própria, então não espera o job web: roda ao
  # mesmo tempo que ele e o e2e. Pelo mesmo motivo do e2e, não roda no PR de versão do release-please.
  audit-pwa:
    name: audit-pwa
    needs: changes
    if: needs.changes.outputs.web == 'true' && !startsWith(github.head_ref || '', 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Build de produção
        run: npm run build
      - name: Auditar o PWA
        run: npm run audit:pwa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci
          if-no-files-found: ignore

  agent:
    name: agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check
      - name: Ruff (formato)
        run: uv run ruff format --check
      - name: Tipos
        run: uv run mypy src tests
      - name: Fronteiras do núcleo
        run: uv run lint-imports
      - name: Testes
        run: uv run pytest

  contracts:
    name: contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - name: Validar esquemas e exemplos
        run: npm run validate

  tv-launcher:
    name: tv-launcher
    needs: changes
    if: needs.changes.outputs.tv_launcher == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/tv-launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # O gradle-wrapper.jar é um binário no repositório: confere o hash contra os publicados pelo Gradle.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          min-wrapper-count: 1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # O SDK do Android já vem na imagem do runner.
      - name: Testes de unidade e de tela
        run: ./gradlew --no-daemon testDebugUnitTest
      # Com os segredos do repositório o release sai assinado com a chave fixa do projeto (a mesma do build local,
      # para a TV aceitar a atualização). Sem eles (PR de fora ou de robô, que não recebem segredos) cai na chave de
      # depuração do runner. O keystore é decodificado num arquivo temporário e apagado ao sair do passo.
      - name: Montar o APK de release
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.UNIOVER_TV_KEYSTORE_BASE64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.UNIOVER_TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.UNIOVER_TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.UNIOVER_TV_KEY_PASSWORD }}
        run: |
          signed=false
          if [ -n "$TV_KEYSTORE_BASE64" ]; then
            keystore="$RUNNER_TEMP/uniover-tv.p12"
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$TV_KEYSTORE_BASE64" | base64 -d > "$keystore"
            export UNIOVER_TV_STORE_FILE="$keystore" UNIOVER_TV_STORE_PASSWORD="$TV_KEYSTORE_PASSWORD"
            export UNIOVER_TV_KEY_ALIAS="$TV_KEY_ALIAS" UNIOVER_TV_KEY_PASSWORD="$TV_KEY_PASSWORD"
            signed=true
          else
            echo "::notice::Sem segredos de assinatura neste evento: release assinado com a chave de depuração."
          fi
          ./gradlew --no-daemon assembleRelease
          if [ "$signed" = true ]; then
            apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
            got="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1)"
            want="$(tr -d "[:space:]" < signing-cert.sha256)"
            echo "Certificado do APK: $got"
            test "$got" = "$want" || { echo "::error::o certificado do APK não é o da chave do projeto (signing-cert.sha256)."; exit 1; }
          fi

  image:
    name: image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    # Construção da imagem, duas varreduras e geração do SBOM podem variar com o cache do runner.
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # O runner é descartável: remover o builder no fim do job leva até ~20 s (medido) e não protege nada.
          cleanup: false
      - name: Construir a imagem (sem publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: uniover:ci
          cache-from: type=gha
          # Só o push (develop e main) grava o cache. Gravar em todo PR custava ~30 s por execução (medido) e o cache de
          # um PR só serve a ele mesmo: 8,8 GB dos 10 GB do repositório eram desses blobs, expulsando os caches úteis.
          # Os PRs continuam lendo o cache que a develop gravou.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      - name: Trivy (relatório SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uniover:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"
      - name: Enviar SARIF ao code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
      - name: Trivy (falha com achado CRITICAL ou HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uniover:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: uniover:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: sbom.spdx.json
      # Em produção a API exige a string de conexão. Aqui ela aponta para um banco que não existe: além de subir,
      # prova que /health/live responde sem tocar no banco.
      - name: Subir o contêiner
        run: >-
          docker run -d --name uniover -p 10000:10000 -e PORT=10000
          -e "ConnectionStrings__Default=Host=127.0.0.1;Port=1;Database=none;Username=none;Password=none"
          uniover:ci
      - name: Esperar /health/live
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/health/live || true)
            if [ "$code" = "200" ]; then
              echo "A API respondeu 200 em /health/live."
              exit 0
            fi
            sleep 2
          done
          echo "::error::a API não respondeu 200 em /health/live em 60 segundos."
          docker logs uniover
          exit 1
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:10000
          rules_file_name: .github/zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline
      - name: Parar o contêiner
        if: always()
        run: docker rm -f uniover

  # Check único para exigir nas regras de branch: jobs pulados por caminho contam como verdes.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, commits, api, web, e2e, audit-pwa, agent, contracts, tv-launcher, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resumir
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*)
              echo "::error::algum job falhou ou foi cancelado."
              exit 1
              ;;
          esac
