name: CI

# Conjunto enxuto, a cada PR e a cada push: precisa ficar em ~12 minutos, com os jobs ao mesmo tempo. O que é pesado
# (integração da API com Postgres, E2E completo nos dois projetos, suíte inteira do agente com cobertura, auditoria de
# PWA, APK do lançador e varredura da imagem) roda uma vez por noite em nightly.yml, fora do notebook do dono.
#   api      compila a solução inteira com avisos como erro e roda os testes que não usam Docker
#   web      lint, testes unitários, build de produção (com o orçamento do pacote inicial do angular.json)
#   e2e      fumaça: um projeto (iphone-12) e só as telas críticas de .github/scripts/e2e-smoke.json
#   agent    ruff, tipos, fronteiras do núcleo e o subconjunto rápido do pytest
#   contracts  esquemas e exemplos (a regeneração dos tipos é do contracts-sync.yml)
# Nenhum check daqui é exigência de merge: virar exigência (ci-ok) é decisão do dono, nas regras de branch do GitHub.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      agent: ${{ steps.filter.outputs.agent }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Mexer no próprio fluxo (ci.yml e .github/scripts) roda tudo que ele define: sem isso, um PR que só altera a
          # esteira passaria sem exercitar nenhuma das mudanças.
          filters: |
            api:
              - 'apps/api/**'
              - 'modules.json'
              - 'contracts/shopping/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            web:
              - 'apps/web/**'
              - 'contracts/shopping/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            agent:
              - 'apps/agent/**'
              - '.github/workflows/ci.yml'
            contracts:
              - 'contracts/**'
              - '.github/workflows/ci.yml'

  commits:
    name: commits
    # A develop é a porta de entrada; a main só recebe a develop, já checada.
    # Ficam de fora: PRs de robôs (atualização de dependências) e a volta da main para a develop depois de um
    # release, que só traz o commit de versão criado pela ferramenta de release.
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.head_ref != 'main' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conferir o padrão dos commits do PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOWED_EMAIL: ncormino@gmail.com
        run: bash .github/scripts/check-commits.sh "$BASE_SHA" "$HEAD_SHA"


  # Só o que não precisa de Docker: compila a solução inteira com avisos como erro e roda todos os projetos de teste
  # menos o de integração (Postgres em container, ~4 a 6 min por parte), que fica na rodada noturna.
  # Os scripts rodam de dentro de apps/api: o global.json de lá liga o Microsoft.Testing.Platform no dotnet test.
  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: apps/api/global.json
      # O cache do NuGet segue o arquivo de versões centralizado: muda só quando uma dependência muda.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/api/Directory.Packages.props', 'apps/api/global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Compilar a solução inteira (avisos como erro)
        working-directory: apps/api
        run: dotnet build UniOver.slnx -warnaserror
      - name: Testes (sem o projeto de integração)
        run: bash .github/scripts/run-api-unit-tests.sh --no-build

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Conferir que o E2E cobre todos os projetos do Playwright
        run: bash ../../.github/scripts/check-e2e-projects.sh
      - name: Lint
        run: npm run lint
      - name: Testes unitários
        run: npm test
      - name: Testes do script de retenção dos arquivos com hash
        run: node --test scripts/retained-assets.test.mjs
      # O build aplica o orçamento do pacote inicial (angular.json: aviso a 500 kB, erro a 1 MB) e o dos estilos por componente.
      - name: Build de produção (com o orçamento do pacote inicial)
        run: npm run build


  # E2E de fumaça: um projeto só e só as telas críticas (.github/scripts/e2e-smoke.json: abertura e esqueletos, shell e
  # Início, entrada e renovação da sessão, atualização do shell, Treino e controle da TV). Roda o iphone-12 (WebKit), o
  # aparelho do dono, onde o defeito aparece primeiro; custa mais por teste que o Chromium, mas são ~110 dos ~1440
  # testes. O E2E completo nos dois projetos, em partes, é da rodada noturna (nightly.yml). O build de produção vem do
  # webServer do próprio Playwright. Fica de fora o PR de versão do release-please: ele só muda número de versão.
  e2e-smoke:
    name: e2e-smoke
    needs: changes
    if: needs.changes.outputs.web == 'true' && !startsWith(github.head_ref || '', 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # O Playwright trata o nome do arquivo como filtro: um nome com erro de digitação seria ignorado em silêncio.
      - name: Conferir a lista de fumaça
        run: |
          jq -e '.specs | length > 0' ../../.github/scripts/e2e-smoke.json >/dev/null
          for spec in $(jq -r '.specs[]' ../../.github/scripts/e2e-smoke.json | tr -d '\r'); do
            test -f "$spec" || { echo "::error::e2e-smoke.json lista $spec, que não existe."; exit 1; }
          done
      - name: Instalar o navegador do Playwright
        run: npx playwright install --with-deps "$(jq -r .browser ../../.github/scripts/e2e-smoke.json | tr -d '\r')"
      - name: E2E de fumaça
        run: |
          mapfile -t specs < <(jq -r '.specs[]' ../../.github/scripts/e2e-smoke.json | tr -d '\r')
          npx playwright test --project="$(jq -r .project ../../.github/scripts/e2e-smoke.json | tr -d '\r')" "${specs[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-e2e-smoke-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

  agent:
    name: agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check
      - name: Ruff (formato)
        run: uv run ruff format --check
      - name: Tipos
        run: uv run mypy src tests
      - name: Fronteiras do núcleo
        run: uv run lint-imports
      # Sem o piso de cobertura (--no-cov): ele é da suíte inteira, na rodada noturna. --durations mostra os testes mais lentos.
      - name: Testes
        run: uv run pytest --no-cov -p no:cacheprovider --durations=15

  contracts:
    name: contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - name: Validar esquemas e exemplos
        run: npm run validate

  # Check único para exigir nas regras de branch (decisão do dono): jobs pulados por caminho contam como verdes.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, commits, api, web, e2e-smoke, agent, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resumir
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*)
              echo "::error::algum job falhou ou foi cancelado."
              exit 1
              ;;
          esac
