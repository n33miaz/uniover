name: Diag tv devices

# Temporário: mede, com o tempo de cada teste, as partes que saíram da antiga tv-devices (que não travava: era grande demais
# para o teto de 20 min). Usa as mesmas partes do nightly.yml (api-partitions.json). Sai antes do merge.
on:
  pull_request:
    paths:
      - ".github/workflows/diag-tv.yml"

permissions:
  contents: read

jobs:
  diag:
    name: diag (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [tv, pc-control, devices]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: apps/api/global.json
      - name: Testar
        working-directory: apps/api
        env:
          PART: ${{ matrix.part }}
        run: |
          mapfile -t patterns < <(jq -r --arg n "$PART" '.parts[] | select(.name == $n) | .namespaces[]' ../../.github/scripts/api-partitions.json)
          if [ "${#patterns[@]}" -eq 0 ]; then echo "::error::a parte \"$PART\" não existe em api-partitions.json."; exit 1; fi
          dotnet test --project tests/UniOver.IntegrationTests/UniOver.IntegrationTests.csproj \
            --output Detailed --hangdump --hangdump-timeout 6m --hangdump-type Mini \
            --filter-namespace "${patterns[@]}" 2>&1 | tee ../../diag.log; exit "${PIPESTATUS[0]}"
