name: Web assets

# Os arquivos com hash do PWA de uma versão, anexados ao Release dela como `web-assets-<versão>.tar.gz` (e `.sha256`). A imagem
# das versões seguintes os retém no wwwroot (etapa `retained` do Dockerfile): uma página aberta (ou um aparelho sem service
# worker ativo) ainda pede os pedaços de código da versão que carregou, e depois de um deploy eles dariam 404.
#
# Dois usos:
# - chamado pelo deploy.yml depois de cada publicação (sem `tag`: usa o commit publicado);
# - manual (workflow_dispatch) com a `tag` de um Release que já existe (ex.: v0.54.0). É o BOOTSTRAP: rode-o para a versão que
#   está no ar ANTES da primeira publicação com retenção, senão a imagem nova não tem de onde reter os arquivos dela.
#   Para uma tag antiga o build usa o Dockerfile e o script DESTE ramo sobre o código da tag (a tag não tem a etapa web-dist).
#
# O build sai do MESMO Dockerfile da imagem (etapa `web-dist`), então os nomes são os que o servidor serve. Quando a tag é a
# versão no ar, o job confere que o artefato tem tudo o que a página no ar usa (se o build não for reproduzível, falha em vez
# de reter nomes que ninguém pede) e confere que a imagem no ar reteve as versões anteriores (só avisa: a publicação já
# aconteceu). Fora do artefato: index.html, sw.js, manifestos.
# Idempotente: `--clobber` troca os anexos de uma repetição do mesmo Release.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag do Release (vazio: o commit publicado)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de um Release que já existe (ex.: v0.54.0)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  web-assets:
    name: web-assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      # Variável do repositório APP_URL; se não existir, vale o endereço padrão (a mesma regra do deploy.yml).
      APP_URL: ${{ vars.APP_URL || 'https://uniover.onrender.com' }}
      TAG_INPUT: ${{ inputs.tag }}
    steps:
      - name: Escolher o que montar
        id: target
        run: |
          set -euo pipefail
          if [ -n "$TAG_INPUT" ]; then
            case "$TAG_INPUT" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::a tag '$TAG_INPUT' não é do formato vX.Y.Z."; exit 1 ;;
            esac
            echo "ref=refs/tags/$TAG_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      # O código a empacotar (a tag pedida ou o commit publicado) e, ao lado, as ferramentas deste ramo (Dockerfile e script).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.ref }}
          path: src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Montar o PWA como a imagem o monta
        run: docker buildx build -f tools/Dockerfile --target web-dist --output type=local,dest=web-dist src
      - name: Empacotar os arquivos com hash
        id: pack
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < src/VERSION)
          if [ -n "$TAG_INPUT" ] && [ "v$version" != "$TAG_INPUT" ]; then
            echo "::error::o VERSION da tag $TAG_INPUT diz $version."
            exit 1
          fi
          node tools/apps/web/scripts/retained-assets.mjs pack web-dist "web-assets-$version.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Só quando a tag é a versão que está no ar (o commit de /health/version é o do código empacotado).
      - name: Conferir com o PWA no ar
        id: live
        run: |
          set -euo pipefail
          version="${{ steps.pack.outputs.version }}"
          expected=$(git -C src rev-parse HEAD)
          live_commit=$(curl -fsS --max-time 30 "$APP_URL/health/version" | jq -r '.commit // empty' || true)
          if [ "${live_commit,,}" != "${expected,,}" ]; then
            echo "A versão no ar (${live_commit:-desconhecida}) não é a de $version ($expected): sem conferência com a página no ar."
            echo "is_live=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS --max-time 30 "$APP_URL/" -o served.html
          node tools/apps/web/scripts/retained-assets.mjs covers "web-assets-$version.tar.gz" served.html
          echo "is_live=true" >> "$GITHUB_OUTPUT"
      # A retenção da imagem é de melhor esforço (a publicação não depende do GitHub): aqui a falha vira aviso bem visível.
      - name: Conferir se a imagem no ar reteve as versões anteriores
        if: steps.live.outputs.is_live == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tools/apps/web/scripts/retained-assets.mjs check-live \
            --repo "$GITHUB_REPOSITORY" --url "$APP_URL" --current "${{ steps.pack.outputs.version }}"
      - name: Anexar ao Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${{ steps.pack.outputs.version }}"
          if ! gh release view "v$version" > /dev/null 2>&1; then
            echo "::error::o Release v$version não existe: não há onde anexar."
            exit 1
          fi
          gh release upload "v$version" "web-assets-$version.tar.gz" "web-assets-$version.tar.gz.sha256" --clobber
          echo "Arquivos com hash anexados ao Release v$version."
