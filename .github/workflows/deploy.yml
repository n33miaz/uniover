name: Deploy

# Política de publicação
# - As migrations rodam ANTES do código novo entrar no ar. Por alguns minutos o código antigo roda sobre o schema novo.
# - Por isso toda migration deve ser retrocompatível com a versão anterior da API: acrescentar primeiro; remover ou
#   renomear coluna só em duas etapas, depois que nenhum código a usa.
# - Migration aplicada é imutável: um erro se corrige com uma migration nova, nunca editando a antiga.
# - As migrations usam a conexão DIRETA do Neon com o papel dono. A aplicação no Render usa o pooler com o papel
#   sem DDL; a conexão do dono nunca vai para o Render.
# - O Render deve ficar com o auto-deploy DESLIGADO: quem dispara a troca do código é o deploy hook, depois das
#   migrations. Sem o segredo RENDER_DEPLOY_HOOK_URL, as migrations rodam e o deploy é pulado com aviso.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Variável do repositório APP_URL; se não existir, vale o endereço padrão.
  APP_URL: ${{ vars.APP_URL || 'https://uniover.onrender.com' }}

jobs:
  migrate:
    name: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/api/global.json
      - name: Instalar o dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.13
      - name: Restaurar os pacotes
        working-directory: apps/api
        run: dotnet restore UniOver.slnx
      # A conexão só é gerada com um valor de mentira: o dotnet ef não a usa para montar o bundle.
      - name: Gerar os bundles de migration
        working-directory: apps/api
        run: bash scripts/build-bundles.sh
      - name: Aplicar as migrations (conexão direta, papel dono)
        working-directory: apps/api
        env:
          DB_OWNER_CONNECTION: ${{ secrets.NEON_OWNER_CONNECTION }}
        run: |
          if [ -z "$DB_OWNER_CONNECTION" ]; then
            echo "::error::o segredo NEON_OWNER_CONNECTION não está cadastrado no repositório."
            exit 1
          fi
          echo "::add-mask::$DB_OWNER_CONNECTION"
          export UNIOVER_MIGRATIONS_CONNECTION="$DB_OWNER_CONNECTION"
          bash scripts/migrate-all.sh
      # Retenção da auditoria a cada publicação. O serviço da API também a executa, mas só 10 minutos depois da partida, e o
      # Render grátis dorme: sem este passo a limpeza poderia nunca rodar. As funções são as das migrations (SECURITY
      # DEFINER, com o piso de retenção dentro delas) e os prazos são os de AuditRetentionPolicy (um teste confere que são
      # os mesmos: 180 dias para segurança, 30 para comandos da TV). Mesma conexão do passo acima (papel dono, direta).
      # O segredo está no formato do Npgsql (Chave=valor;...), que o psql não lê: o python3 do runner o converte nas
      # variáveis PG*, só dentro do processo, depois de mascarar cada parte nos logs. Não faz eco da conexão e sem set -x.
      # continue-on-error: limpar é manutenção, e uma falha aqui (que o passo mostra em vermelho) não pode impedir a publicação.
      - name: Limpar a auditoria vencida (retenção)
        continue-on-error: true
        env:
          DB_OWNER_CONNECTION: ${{ secrets.NEON_OWNER_CONNECTION }}
        run: |
          set -euo pipefail
          if [ -z "$DB_OWNER_CONNECTION" ]; then
            echo "::error::o segredo NEON_OWNER_CONNECTION não está cadastrado no repositório."
            exit 1
          fi
          echo "::add-mask::$DB_OWNER_CONNECTION"
          if ! command -v psql > /dev/null 2>&1; then
            sudo apt-get update -qq > /dev/null
            sudo apt-get install -y --no-install-recommends postgresql-client > /dev/null
          fi
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          # (schema, dias): os mesmos de AuditRetentionPolicy. As funções nunca apagam abaixo do próprio piso.
          PURGES = [
              ("identity", 180),
              ("devices", 180),
              ("tv", 30),
          ]

          KEYS = {
              "PGHOST": ("host", "server", "data source", "address", "addr", "network address"),
              "PGPORT": ("port",),
              "PGDATABASE": ("database", "db"),
              "PGUSER": ("username", "user name", "user id", "userid", "uid", "user"),
              "PGPASSWORD": ("password", "psw", "pwd"),
              "PGSSLMODE": ("ssl mode", "sslmode"),
          }
          SSL_MODES = {
              "disable": "disable", "allow": "allow", "prefer": "prefer", "require": "require",
              "verifyca": "verify-ca", "verify-ca": "verify-ca", "verifyfull": "verify-full", "verify-full": "verify-full",
          }


          def parse(text):
              """Lê 'Chave=valor;Chave=valor' do Npgsql; o valor pode vir entre aspas simples ou duplas (aspa repetida escapa)."""
              pairs = {}
              i, n = 0, len(text)
              while i < n:
                  while i < n and text[i] in "; \t\r\n":
                      i += 1
                  if i >= n:
                      break
                  eq = text.find("=", i)
                  if eq < 0:
                      raise ValueError("par sem '='")
                  key = text[i:eq].strip().lower()
                  i = eq + 1
                  while i < n and text[i] in " \t":
                      i += 1
                  if i < n and text[i] in "'\"":
                      quote = text[i]
                      i += 1
                      chars = []
                      while True:
                          if i >= n:
                              raise ValueError("aspas sem fechar")
                          if text[i] == quote:
                              if i + 1 < n and text[i + 1] == quote:
                                  chars.append(quote)
                                  i += 2
                                  continue
                              i += 1
                              break
                          chars.append(text[i])
                          i += 1
                      value = "".join(chars)
                      while i < n and text[i] in " \t":
                          i += 1
                  else:
                      end = text.find(";", i)
                      end = n if end < 0 else end
                      value = text[i:end].strip()
                      i = end
                  pairs[key] = value
              return pairs


          try:
              pairs = parse(os.environ["DB_OWNER_CONNECTION"])
          except ValueError as error:
              print(f"::error::o segredo NEON_OWNER_CONNECTION não está no formato esperado ({error}).")
              sys.exit(1)

          settings = {}
          for name, synonyms in KEYS.items():
              for synonym in synonyms:
                  if pairs.get(synonym):
                      settings[name] = pairs[synonym]
                      break
          missing = [name for name in ("PGHOST", "PGDATABASE", "PGUSER", "PGPASSWORD") if name not in settings]
          if missing:
              print("::error::a conexão do segredo NEON_OWNER_CONNECTION não tem: " + ", ".join(missing) + ".")
              sys.exit(1)
          settings.setdefault("PGPORT", "5432")
          settings["PGSSLMODE"] = SSL_MODES.get(settings.get("PGSSLMODE", "require").lower(), "require")

          # Cada parte sai dos logs ANTES de qualquer uso (o erro do psql pode citar o servidor).
          for name in ("PGHOST", "PGDATABASE", "PGUSER", "PGPASSWORD"):
              print("::add-mask::" + settings[name])

          env = {key: value for key, value in os.environ.items() if key != "DB_OWNER_CONNECTION"}
          env.update(settings)

          failed = False
          for schema, days in PURGES:
              sql = f'SELECT "{schema}"."purge_audit"({days})'
              result = subprocess.run(
                  ["psql", "-X", "-q", "-A", "-t", "-v", "ON_ERROR_STOP=1", "-c", sql],
                  env=env, capture_output=True, text=True, check=False,
              )
              if result.returncode != 0:
                  # Só o começo da primeira linha de erro, sem endereços IP (o servidor já está mascarado).
                  detail = re.sub(r"\d{1,3}(\.\d{1,3}){3}", "<ip>", (result.stderr.strip().splitlines() or [""])[0])[:200]
                  print(f"::error::{schema}.purge_audit({days}) falhou (psql saiu com {result.returncode}): {detail}")
                  failed = True
                  continue
              print(f"{schema}.purge_audit({days}): {result.stdout.strip()} linha(s) vencida(s) apagada(s).")

          sys.exit(1 if failed else 0)
          PY

  deploy:
    name: deploy
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      deployed: ${{ steps.hook.outputs.deployed }}
    steps:
      - name: Disparar o deploy no Render
        id: hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::o segredo RENDER_DEPLOY_HOOK_URL não existe: as migrations foram aplicadas, mas o código não foi publicado."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$HOOK_URL"
          # A URL do hook é credencial: sem -v, sem eco, e o erro do curl (que poderia citá-la) é descartado.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -X POST "$HOOK_URL" 2>/dev/null || true)
          case "$code" in
            200)
              echo "Deploy iniciado no Render."
              ;;
            202)
              echo "Já havia um deploy em andamento no Render; seguindo com a espera."
              ;;
            409)
              echo "::error::o serviço no Render está suspenso (409). Reative o serviço no painel e rode o workflow de novo."
              exit 1
              ;;
            *)
              echo "::error::o deploy hook respondeu com o código '${code:-sem resposta}'. Confira o segredo RENDER_DEPLOY_HOOK_URL."
              exit 1
              ;;
          esac
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      # O serviço antigo continua respondendo enquanto o Render constrói a imagem nova; a pausa inicial evita
      # dar por pronta a versão anterior. O plano grátis também pode estar dormindo: a primeira resposta demora.
      - name: Esperar o serviço ficar saudável
        if: steps.hook.outputs.deployed == 'true'
        run: |
          sleep 90
          for i in $(seq 1 76); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$APP_URL/health/live" || true)
            if [ "$code" = "200" ]; then
              echo "/health/live respondeu 200 (tentativa $i)."
              exit 0
            fi
            echo "Tentativa $i: /health/live respondeu '${code:-sem resposta}'."
            sleep 15
          done
          echo "::error::o serviço não respondeu 200 em /health/live em cerca de 20 minutos."
          exit 1
      - name: Conferir o PWA e a API
        if: steps.hook.outputs.deployed == 'true'
        run: |
          curl -fsS --max-time 30 "$APP_URL/" | grep -qi "<app-root" \
            || { echo "::error::a raiz não devolveu o index.html do PWA."; exit 1; }
          curl -fsS --max-time 30 -o /dev/null "$APP_URL/api/v1/identity/info" \
            || { echo "::error::/api/v1/identity/info não respondeu com sucesso."; exit 1; }
          echo "PWA e API respondendo."

  # Varredura passiva da superfície pública (o ZAP não autentica). Só roda se o código foi mesmo publicado.
  dast:
    name: dast
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.APP_URL }}
          rules_file_name: .github/zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-producao
