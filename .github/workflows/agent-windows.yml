name: Agent on Windows

# O agente roda no Windows do dono e dos amigos, e uma parte dele só existe lá: o lançador, o supervisor
# (rollback, recuperação da pasta `app`, troca de versão), o instalador e a tarefa agendada. Esses testes
# usam o Windows PowerShell 5.1 de verdade e são PULADOS no Linux do `ci.yml`, então sem este job nada na
# esteira jamais exercita a volta atrás que mantém um PC vivo depois de uma atualização ruim.
#
# Este arquivo é só do agente e não entra no `ci-ok`: ligar o job como exigência de merge é uma decisão
# do dono (Settings > Branches), não deste arquivo. Todos os testes que mexem na tarefa agendada usam um
# nome só do teste e a removem no fim; nenhum toca na tarefa `UniOver agente` nem em `%LOCALAPPDATA%` real.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-windows.yml"
  push:
    branches: [develop, main]
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-windows:
    name: agent-windows
    runs-on: windows-latest
    # A suíte inteira roda em 4 processos (o runner tem 4 vCPUs) e leva perto de 10 minutos; o teto existe para um teste
    # travado não prender o runner.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/agent
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - run: uv sync --locked
      # Uma passada só da suíte inteira, com cobertura. Os testes do supervisor e do lançador esperam por processos reais
      # do PowerShell (pouca CPU, muito relógio), por isso rodam em paralelo. `--dist loadfile` deixa cada arquivo inteiro
      # num processo só e em sequência. Só o arquivo da baliza abre POSTs de baliza e só o da tarefa agendada registra
      # tarefas "UniOver teste"; como esses testes contam o que existe na máquina inteira, dois deles ao mesmo tempo se
      # enxergariam. Os mutex do supervisor e do lançador levam a pasta da instalação, que é a temporária de cada teste.
      - name: Suíte inteira do agente (os testes do lançador, do supervisor e do instalador não podem ser pulados)
        run: |
          uv run pytest -rs -p no:cacheprovider -n 4 --dist loadfile --durations=30 2>&1 | Tee-Object -Variable lines
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "a suíte do agente falhou (código $code)" }
          # No Windows eles têm de rodar: pular aqui seria o mesmo que não ter o job. Os outros pulos da suíte (permissão
          # do POSIX, ensaio visual opt-in) continuam permitidos.
          $windowsOnly = 'test_launcher_recovery|test_run_agent_state|test_run_agent_sync|test_installer_swap|test_windows_installer|test_scheduled_task'
          $skipped = $lines | Where-Object { "$_" -match "^SKIPPED \[\d+\] tests[/\x5C]($windowsOnly)\.py" -or "$_" -match '^SKIPPED .*precisa do Windows' }
          if ($skipped) { throw ("testes que só rodam no Windows foram pulados:`n" + ($skipped -join "`n")) }
