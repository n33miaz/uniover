name: Agent on Windows

# O agente roda no Windows do dono e dos amigos, e uma parte dele só existe lá: o lançador, o supervisor
# (rollback, recuperação da pasta `app`, troca de versão), o instalador e a tarefa agendada. Esses testes
# usam o Windows PowerShell 5.1 de verdade e são PULADOS no Linux do `ci.yml`, então sem este job nada na
# esteira jamais exercita a volta atrás que mantém um PC vivo depois de uma atualização ruim.
#
# Este arquivo é só do agente e não entra no `ci-ok`: ligar o job como exigência de merge é uma decisão
# do dono (Settings > Branches), não deste arquivo. Todos os testes que mexem na tarefa agendada usam um
# nome só do teste e a removem no fim; nenhum toca na tarefa `UniOver agente` nem em `%LOCALAPPDATA%` real.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-windows.yml"
  push:
    branches: [develop, main]
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-windows:
    name: agent-windows
    runs-on: windows-latest
    # A suíte inteira roda em 4 processos (o runner tem 4 vCPUs) e leva perto de 10 minutos; o teto existe para um teste
    # travado não prender o runner.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/agent
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - run: uv sync --locked
      # Uma passada só da suíte inteira, com cobertura. Os testes do supervisor e do lançador esperam por processos reais
      # do PowerShell (pouca CPU, muito relógio), por isso rodam em paralelo. `--dist loadfile` deixa cada arquivo inteiro
      # num processo só e em sequência. Só o arquivo da baliza abre POSTs de baliza e só o da tarefa agendada registra
      # tarefas "UniOver teste"; como esses testes contam o que existe na máquina inteira, dois deles ao mesmo tempo se
      # enxergariam. Os mutex do supervisor e do lançador levam a pasta da instalação, que é a temporária de cada teste.
      - name: Suíte inteira do agente com testes obrigatórios do Windows
        run: |
          uv run pytest -rs -p no:cacheprovider -n 4 --dist loadfile --durations=30 --junitxml=windows-tests.xml
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "a suíte do agente falhou (código $code)" }
          # No Windows eles têm de rodar: pular aqui seria o mesmo que não ter o job. Os outros pulos da suíte (permissão
          # do POSIX, ensaio visual opt-in) continuam permitidos.
          $requiredModules = @(
            'test_launcher_recovery'
            'test_run_agent_state'
            'test_run_agent_sync'
            'test_installer_swap'
            'test_windows_installer'
            'test_scheduled_task'
            'test_update_path'
          )
          $schedulerModule = 'test_update_path'
          $schedulerTests = @(
            'test_the_real_launcher_swap_works_in_task_scheduler_and_rolls_back_on_failure'
            'test_task_rename_keeps_the_old_task_until_the_new_one_is_verified'
          )
          $reportText = Get-Content -LiteralPath windows-tests.xml -Raw
          if ([string]::IsNullOrWhiteSpace($reportText)) { throw 'XML JUnit sem testes aprovados' }
          [xml]$report = $reportText
          $passed = $report.SelectNodes('//testcase[not(skipped or failure or error)]')
          if ($passed.Count -eq 0) { throw 'XML JUnit sem testes aprovados' }

          function Get-TestIdentity($test) {
            $class = $test.GetAttribute('classname')
            $name = $test.GetAttribute('name')
            $moduleClass = $class
            $module = $class
            if ($class -cmatch '^(tests\.([^.]+))(\..*)?$') {
              $moduleClass = $Matches[1]
              $module = $Matches[2]
            }
            [pscustomobject]@{
              Class = $class
              ModuleClass = $moduleClass
              Module = $module
              Name = $name
              BaseName = $name -creplace '\[.*$', ''
            }
          }

          $skipped = foreach ($test in $report.SelectNodes('//testcase[skipped]')) {
            $identity = Get-TestIdentity $test
            if ($identity.Module -ceq $schedulerModule) {
              if ($identity.BaseName -cnotin $schedulerTests) { continue }
            } elseif ($identity.Module -cnotin $requiredModules -and
                      $test.SelectSingleNode('skipped').GetAttribute('message') -cnotmatch '^precisa do Windows') {
              continue
            }
            "$($identity.Class).$($identity.Name)"
          }
          if ($skipped) {
            throw ("testes obrigatórios do Windows foram pulados:" + [Environment]::NewLine + ($skipped -join [Environment]::NewLine))
          }

          # Os testes do Agendador valem pelo nome: cada um tem de estar no relatório e ter passado. Sem isto, renomear ou
          # apagar um deles faria a lista acima não casar com nada e o job passaria sem ter rodado o teste.
          $schedulerProblems = foreach ($name in $schedulerTests) {
            $cases = @($report.SelectNodes('//testcase') | Where-Object {
              $identity = Get-TestIdentity $_
              $identity.Module -ceq $schedulerModule -and $identity.BaseName -ceq $name
            })
            if ($cases.Count -eq 0) { "$schedulerModule.$name (ausente do relatório)"; continue }
            if (@($cases | Where-Object { $_.SelectSingleNode('skipped|failure|error') }).Count -gt 0) {
              "$schedulerModule.$name (não passou)"
            }
          }
          if ($schedulerProblems) {
            throw ("testes obrigatórios do Agendador ausentes ou sem aprovação:" + [Environment]::NewLine +
                   ($schedulerProblems -join [Environment]::NewLine))
          }

          # O relatório único do xdist precisa registrar pelo menos um teste aprovado de cada módulo.
          $passedModules = $passed |
            ForEach-Object { (Get-TestIdentity $_).ModuleClass }
          $missing = $requiredModules | Where-Object { "tests.$_" -cnotin $passedModules }
          if ($missing) { throw ("módulos obrigatórios sem testes aprovados: " + ($missing -join ', ')) }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        continue-on-error: true
        with:
          name: windows-tests
          path: apps/agent/windows-tests.xml
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
