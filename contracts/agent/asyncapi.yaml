asyncapi: 3.0.0
info:
  title: Contrato de mensagens do agente UniOver
  version: 1.0.0
  description: >-
    Envelope único (envelope.schema.json) igual em qualquer transporte. Hoje o transporte é
    WebSocket; o servidor MQTT está declarado para o futuro e ainda não é usado.
servers:
  api-websocket:
    host: uniover.example.com
    protocol: wss
    pathname: /api/v1/devices/agents/{agentId}/ws
    description: Transporte em uso. Um canal por agente.
    variables:
      agentId:
        description: Identificador do agente (ex. pc-casa).
  mqtt-futuro:
    host: broker.example.com
    protocol: mqtts
    description: NÃO USADO AINDA. Alternativa futura com o mesmo envelope (uniover/<agente>/cmd e .../evt).
channels:
  agentCommands:
    address: uniover/{agentId}/cmd
    description: API para agente. No WebSocket é o mesmo socket; no MQTT, o tópico de comandos.
    parameters:
      agentId: {}
    messages:
      apiKeepalive:
        name: api.keepalive.v1
        contentType: application/json
        payload:
          $ref: './messages/api.keepalive.v1.schema.json'
      tvKey:
        name: tv.key.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.key.v1.schema.json'
      tvKeyV2:
        name: tv.key.v2
        contentType: application/json
        payload:
          $ref: './messages/tv.key.v2.schema.json'
      tvKeyV3:
        name: tv.key.v3
        contentType: application/json
        payload:
          $ref: './messages/tv.key.v3.schema.json'
      tvPowerOff:
        name: tv.power.off.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.power.off.v1.schema.json'
      tvWake:
        name: tv.wake.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.wake.v1.schema.json'
      tvPresence:
        name: tv.presence.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.presence.v1.schema.json'
      tvSettingsOpen:
        name: tv.settings.open.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.settings.open.v1.schema.json'
      tvAppLaunch:
        name: tv.app.launch.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.app.launch.v1.schema.json'
      tvAppsRefresh:
        name: tv.apps.refresh.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.apps.refresh.v1.schema.json'
      tvText:
        name: tv.text.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.text.v1.schema.json'
      tvCleanup:
        name: tv.cleanup.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.cleanup.v1.schema.json'
      tvCleanupConfig:
        name: tv.cleanup.config.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.cleanup.config.v1.schema.json'
      tvLivre:
        name: tv.livre.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.livre.v1.schema.json'
      tvLivrePhoto:
        name: tv.livre.photo.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.livre.photo.v1.schema.json'
      agentLogsRequest:
        name: agent.logs.request.v1
        contentType: application/json
        payload:
          $ref: './messages/agent.logs.request.v1.schema.json'
      agentMaintenance:
        name: agent.maintenance.v1
        contentType: application/json
        payload:
          $ref: './messages/agent.maintenance.v1.schema.json'
      tvPermissionRequest:
        name: tv.permission.request.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.permission.request.v1.schema.json'
      tvAdbRebind:
        name: tv.adb.rebind.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.adb.rebind.v1.schema.json'
      tvPair:
        name: tv.pair.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.pair.v1.schema.json'
      tvDiscover:
        name: tv.discover.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.discover.v1.schema.json'
      pcPointer:
        name: pc.pointer.v1
        contentType: application/json
        payload:
          $ref: './messages/pc.pointer.v1.schema.json'
      pcClick:
        name: pc.click.v1
        contentType: application/json
        payload:
          $ref: './messages/pc.click.v1.schema.json'
      pcClickV2:
        name: pc.click.v2
        contentType: application/json
        payload:
          $ref: './messages/pc.click.v2.schema.json'
      pcKey:
        name: pc.key.v1
        contentType: application/json
        payload:
          $ref: './messages/pc.key.v1.schema.json'
      pcKeyV2:
        name: pc.key.v2
        contentType: application/json
        payload:
          $ref: './messages/pc.key.v2.schema.json'
      pcText:
        name: pc.text.v1
        contentType: application/json
        payload:
          $ref: './messages/pc.text.v1.schema.json'
      pcTextV2:
        name: pc.text.v2
        contentType: application/json
        payload:
          $ref: './messages/pc.text.v2.schema.json'
      pcMedia:
        name: pc.media.v1
        contentType: application/json
        payload:
          $ref: './messages/pc.media.v1.schema.json'
      pcPower:
        name: pc.power.v1
        contentType: application/json
        payload:
          $ref: './messages/pc.power.v1.schema.json'
      pcAppLaunch:
        name: pc.app.launch.v1
        contentType: application/json
        payload:
          $ref: './messages/pc.app.launch.v1.schema.json'
      pcRtcOffer:
        name: pc.rtc.offer.v1
        contentType: application/json
        payload:
          $ref: './messages/pc.rtc.offer.v1.schema.json'
      pcRtcCandidate:
        name: pc.rtc.candidate.v1
        contentType: application/json
        payload:
          $ref: './messages/pc.rtc.candidate.v1.schema.json'
      pcRtcClose:
        name: pc.rtc.close.v1
        contentType: application/json
        payload:
          $ref: './messages/pc.rtc.close.v1.schema.json'
  agentEvents:
    address: uniover/{agentId}/evt
    description: Agente para API. No WebSocket é o mesmo socket; no MQTT, o tópico de eventos.
    parameters:
      agentId: {}
    messages:
      agentKeepalive:
        name: agent.keepalive.v1
        contentType: application/json
        payload:
          $ref: './messages/agent.keepalive.v1.schema.json'
      agentHello:
        name: agent.hello.v1
        contentType: application/json
        payload:
          $ref: './messages/agent.hello.v1.schema.json'
      tvState:
        name: tv.state.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.state.v1.schema.json'
      commandResult:
        name: command.result.v1
        contentType: application/json
        payload:
          $ref: './messages/command.result.v1.schema.json'
      tvApps:
        name: tv.apps.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.apps.v1.schema.json'
      tvAppsV2:
        name: tv.apps.v2
        contentType: application/json
        payload:
          $ref: './messages/tv.apps.v2.schema.json'
      tvWatchdog:
        name: tv.watchdog.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.watchdog.v1.schema.json'
      tvCleanupResult:
        name: tv.cleanup.result.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.cleanup.result.v1.schema.json'
      tvLivreState:
        name: tv.livre.state.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.livre.state.v1.schema.json'
      agentLogs:
        name: agent.logs.v1
        contentType: application/json
        payload:
          $ref: './messages/agent.logs.v1.schema.json'
      agentUpdateStatus:
        name: agent.update.status.v1
        contentType: application/json
        payload:
          $ref: './messages/agent.update.status.v1.schema.json'
      tvPermission:
        name: tv.permission.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.permission.v1.schema.json'
      tvDiscovery:
        name: tv.discovery.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.discovery.v1.schema.json'
      agentDiagnostics:
        name: agent.diagnostics.v1
        contentType: application/json
        payload:
          $ref: './messages/agent.diagnostics.v1.schema.json'
      pcApps:
        name: pc.apps.v1
        contentType: application/json
        payload:
          $ref: './messages/pc.apps.v1.schema.json'
      pcRtcAnswer:
        name: pc.rtc.answer.v1
        contentType: application/json
        payload:
          $ref: './messages/pc.rtc.answer.v1.schema.json'
      pcRtcClosed:
        name: pc.rtc.closed.v1
        contentType: application/json
        payload:
          $ref: './messages/pc.rtc.closed.v1.schema.json'
operations:
  sendApiKeepalive:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API mantém o canal WebSocket ativo no proxy.
    messages:
      - $ref: '#/channels/agentCommands/messages/apiKeepalive'
  receiveAgentKeepalive:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o batimento do agente.
    messages:
      - $ref: '#/channels/agentEvents/messages/agentKeepalive'
  sendTvKey:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API envia uma tecla ao agente.
  receiveHello:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o hello do agente.
    messages:
      - $ref: '#/channels/agentEvents/messages/agentHello'
  receiveTvState:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o estado da TV.
    messages:
      - $ref: '#/channels/agentEvents/messages/tvState'
  receiveCommandResult:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o resultado de um comando.
    messages:
      - $ref: '#/channels/agentEvents/messages/commandResult'
  sendTvKeyV2:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API envia uma tecla ao agente, com pressão curta ou longa.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvKeyV2'
  sendTvKeyV3:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API envia ao agente uma tecla que só a v3 conhece (guia, ferramentas, cores, mídia...).
    messages:
      - $ref: '#/channels/agentCommands/messages/tvKeyV3'
  sendTvPowerOff:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API pede o desligamento seguro da TV; o agente só aperta POWER depois de ler que ela está ligada, e nunca a liga.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvPowerOff'
  sendTvWake:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API avisa que o app está aberto, para o agente aquecer a sessão com a TV.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvWake'
  sendTvPresence:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API avisa que alguém está diante da tela da TV no app (tela visível), para o agente poder abrir uma conexão ADB nova.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvPresence'
  sendTvAppLaunch:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API pede ao agente que abra um app da TV por pacote ou link.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvAppLaunch'
  sendTvSettingsOpen:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API pede ao agente que abra na TV a tela de rede ou as configurações (lista fechada, só por toque da pessoa).
    messages:
      - $ref: '#/channels/agentCommands/messages/tvSettingsOpen'
  sendTvAppsRefresh:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API pede ao agente a lista de apps da TV.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvAppsRefresh'
  sendTvText:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API envia um texto para digitar na TV.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvText'
  receiveTvApps:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe a lista de apps da TV.
    messages:
      - $ref: '#/channels/agentEvents/messages/tvApps'
  receiveTvAppsV2:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe a lista de apps da TV com o ícone de cada app.
    messages:
      - $ref: '#/channels/agentEvents/messages/tvAppsV2'
  receiveTvWatchdog:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe um evento do vigia do controle remoto.
    messages:
      - $ref: '#/channels/agentEvents/messages/tvWatchdog'
  sendTvCleanup:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API pede ao agente que feche os apps da TV e libere memória, sem derrubar o controle remoto.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvCleanup'
  sendTvCleanupConfig:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API atualiza as preferências de limpeza automática no agente compatível.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvCleanupConfig'
  receiveTvCleanupResult:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o que a limpeza da TV fez (apps fechados e memória antes e depois).
    messages:
      - $ref: '#/channels/agentEvents/messages/tvCleanupResult'
  sendTvLivre:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API pede ao agente um passo do TV Livre (instalar, definir como padrão, aplicar a configuração, voltar ao original).
    messages:
      - $ref: '#/channels/agentCommands/messages/tvLivre'
  sendTvLivrePhoto:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API envia ao agente, em pedaços, a foto do fundo do TV Livre.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvLivrePhoto'
  receiveTvLivreState:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o estado do TV Livre na TV depois de cada ação.
    messages:
      - $ref: '#/channels/agentEvents/messages/tvLivreState'
  sendAgentLogsRequest:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: O administrador pede ao agente o fim do registro dele (arquivo fixo, sem segredos).
    messages:
      - $ref: '#/channels/agentCommands/messages/agentLogsRequest'
  receiveAgentLogs:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o fim do registro do agente, já higienizado, antes do resultado do comando.
    messages:
      - $ref: '#/channels/agentEvents/messages/agentLogs'
  sendAgentMaintenance:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: O administrador (com passkey) pede ao agente que se atualize ou reinicie pelo supervisor.
    messages:
      - $ref: '#/channels/agentCommands/messages/agentMaintenance'
  receiveAgentUpdateStatus:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o estado da auto-atualização do agente (versão instalada, a mais nova vista, resultado da última checagem).
    messages:
      - $ref: '#/channels/agentEvents/messages/agentUpdateStatus'
  sendTvPermissionRequest:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API pede à TV Samsung a permissão do UniOver (o aviso Permitir na tela da TV); só acontece por este pedido.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvPermissionRequest'
  sendTvPair:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API pareia a Android TV em dois passos (mostrar o código na TV; entregar o código digitado); só por pedido do dono.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvPair'
  receiveTvPermission:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o estado da permissão do UniOver na TV Samsung (precisa ou concedida).
    messages:
      - $ref: '#/channels/agentEvents/messages/tvPermission'
  sendTvDiscover:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: O administrador pede ao agente que procure as TVs compatíveis na rede dele.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvDiscover'
  receiveTvDiscovery:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe as TVs compatíveis que o agente achou na rede dele (sem endereço).
    messages:
      - $ref: '#/channels/agentEvents/messages/tvDiscovery'
  receiveAgentDiagnostics:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe erros e ocorrências do próprio agente (sem dados pessoais) para o administrador ver em Sistema.
    messages:
      - $ref: '#/channels/agentEvents/messages/agentDiagnostics'
  sendPcPointer:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API envia o movimento do mouse e a rolagem já somados pelo app.
    messages:
      - $ref: '#/channels/agentCommands/messages/pcPointer'
  sendPcClick:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API envia um clique do mouse (ou o apertar e soltar de um arrasto).
    messages:
      - $ref: '#/channels/agentCommands/messages/pcClick'
      - $ref: '#/channels/agentCommands/messages/pcClickV2'
  sendPcKey:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API envia uma tecla do teclado do PC, com modificadores opcionais.
    messages:
      - $ref: '#/channels/agentCommands/messages/pcKey'
  sendPcText:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API envia um texto para digitar no PC.
    messages:
      - $ref: '#/channels/agentCommands/messages/pcText'
      - $ref: '#/channels/agentCommands/messages/pcTextV2'
  sendPcMedia:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API envia uma tecla de mídia do PC (tocar, faixa, volume, mudo).
    messages:
      - $ref: '#/channels/agentCommands/messages/pcMedia'
  sendPcPower:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API pede bloquear, suspender ou desligar o PC (com a contagem do Windows) ou cancelar o desligamento.
    messages:
      - $ref: '#/channels/agentCommands/messages/pcPower'
  sendPcAppLaunch:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API pede para abrir um app favorito do PC pelo identificador que o agente publicou.
    messages:
      - $ref: '#/channels/agentCommands/messages/pcAppLaunch'
  receivePcApps:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe a lista de apps favoritos que o PC deixa abrir pelo app.
    messages:
      - $ref: '#/channels/agentEvents/messages/pcApps'
  sendPcRtcOffer:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API entrega a oferta do canal direto (WebRTC) do app, com o token de uso único.
    messages:
      - $ref: '#/channels/agentCommands/messages/pcRtcOffer'
  sendPcRtcCandidate:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API repassa um candidato ICE tardio do app.
    messages:
      - $ref: '#/channels/agentCommands/messages/pcRtcCandidate'
  sendPcRtcClose:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API pede fechar o canal direto da sessão.
    messages:
      - $ref: '#/channels/agentCommands/messages/pcRtcClose'
  receivePcRtcAnswer:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe a resposta SDP do agente à oferta do canal direto.
    messages:
      - $ref: '#/channels/agentEvents/messages/pcRtcAnswer'
  receivePcRtcClosed:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o aviso de que o canal direto da sessão fechou, com o motivo.
    messages:
      - $ref: '#/channels/agentEvents/messages/pcRtcClosed'
