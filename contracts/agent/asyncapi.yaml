asyncapi: 3.0.0
info:
  title: Contrato de mensagens do agente UniOver
  version: 1.0.0
  description: >-
    Envelope único (envelope.schema.json) igual em qualquer transporte. Hoje o transporte é
    WebSocket; o servidor MQTT está declarado para o futuro e ainda não é usado.
servers:
  api-websocket:
    host: uniover.example.com
    protocol: wss
    pathname: /api/v1/devices/agents/{agentId}/ws
    description: Transporte em uso. Um canal por agente.
    variables:
      agentId:
        description: Identificador do agente (ex. pc-casa).
  mqtt-futuro:
    host: broker.example.com
    protocol: mqtts
    description: NÃO USADO AINDA. Alternativa futura com o mesmo envelope (uniover/<agente>/cmd e .../evt).
channels:
  agentCommands:
    address: uniover/{agentId}/cmd
    description: API para agente. No WebSocket é o mesmo socket; no MQTT, o tópico de comandos.
    parameters:
      agentId: {}
    messages:
      apiKeepalive:
        name: api.keepalive.v1
        contentType: application/json
        payload:
          $ref: './messages/api.keepalive.v1.schema.json'
      tvKey:
        name: tv.key.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.key.v1.schema.json'
      tvKeyV2:
        name: tv.key.v2
        contentType: application/json
        payload:
          $ref: './messages/tv.key.v2.schema.json'
      tvWake:
        name: tv.wake.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.wake.v1.schema.json'
      tvAppLaunch:
        name: tv.app.launch.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.app.launch.v1.schema.json'
      tvAppsRefresh:
        name: tv.apps.refresh.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.apps.refresh.v1.schema.json'
      tvText:
        name: tv.text.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.text.v1.schema.json'
      tvCleanup:
        name: tv.cleanup.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.cleanup.v1.schema.json'
  agentEvents:
    address: uniover/{agentId}/evt
    description: Agente para API. No WebSocket é o mesmo socket; no MQTT, o tópico de eventos.
    parameters:
      agentId: {}
    messages:
      agentKeepalive:
        name: agent.keepalive.v1
        contentType: application/json
        payload:
          $ref: './messages/agent.keepalive.v1.schema.json'
      agentHello:
        name: agent.hello.v1
        contentType: application/json
        payload:
          $ref: './messages/agent.hello.v1.schema.json'
      tvState:
        name: tv.state.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.state.v1.schema.json'
      commandResult:
        name: command.result.v1
        contentType: application/json
        payload:
          $ref: './messages/command.result.v1.schema.json'
      tvApps:
        name: tv.apps.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.apps.v1.schema.json'
      tvAppsV2:
        name: tv.apps.v2
        contentType: application/json
        payload:
          $ref: './messages/tv.apps.v2.schema.json'
      tvWatchdog:
        name: tv.watchdog.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.watchdog.v1.schema.json'
      tvCleanupResult:
        name: tv.cleanup.result.v1
        contentType: application/json
        payload:
          $ref: './messages/tv.cleanup.result.v1.schema.json'
operations:
  sendApiKeepalive:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API mantém o canal WebSocket ativo no proxy.
    messages:
      - $ref: '#/channels/agentCommands/messages/apiKeepalive'
  receiveAgentKeepalive:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o batimento do agente.
    messages:
      - $ref: '#/channels/agentEvents/messages/agentKeepalive'
  sendTvKey:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API envia uma tecla ao agente.
  receiveHello:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o hello do agente.
    messages:
      - $ref: '#/channels/agentEvents/messages/agentHello'
  receiveTvState:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o estado da TV.
    messages:
      - $ref: '#/channels/agentEvents/messages/tvState'
  receiveCommandResult:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o resultado de um comando.
    messages:
      - $ref: '#/channels/agentEvents/messages/commandResult'
  sendTvKeyV2:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API envia uma tecla ao agente, com pressão curta ou longa.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvKeyV2'
  sendTvWake:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API avisa que o app está aberto, para o agente aquecer a sessão com a TV.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvWake'
  sendTvAppLaunch:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API pede ao agente que abra um app da TV por pacote ou link.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvAppLaunch'
  sendTvAppsRefresh:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API pede ao agente a lista de apps da TV.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvAppsRefresh'
  sendTvText:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API envia um texto para digitar na TV.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvText'
  receiveTvApps:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe a lista de apps da TV.
    messages:
      - $ref: '#/channels/agentEvents/messages/tvApps'
  receiveTvAppsV2:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe a lista de apps da TV com o ícone de cada app.
    messages:
      - $ref: '#/channels/agentEvents/messages/tvAppsV2'
  receiveTvWatchdog:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe um evento do vigia do controle remoto.
    messages:
      - $ref: '#/channels/agentEvents/messages/tvWatchdog'
  sendTvCleanup:
    action: send
    channel:
      $ref: '#/channels/agentCommands'
    summary: A API pede ao agente que feche os apps da TV e libere memória, sem derrubar o controle remoto.
    messages:
      - $ref: '#/channels/agentCommands/messages/tvCleanup'
  receiveTvCleanupResult:
    action: receive
    channel:
      $ref: '#/channels/agentEvents'
    summary: A API recebe o que a limpeza da TV fez (apps fechados e memória antes e depois).
    messages:
      - $ref: '#/channels/agentEvents/messages/tvCleanupResult'
