<span class="mark" aria-hidden="true"><app-auth-glyph [name]="icon()" /></span>

<div #copy class="copy" tabindex="-1" [attr.role]="role()">
  <h1>{{ heading() }}</h1>
  @if (detail(); as text) {
    <p class="detail">{{ text }}</p>
  }
  <!-- Dentro do bloco que recebe o foco: quem usa leitor de tela ouve também o que fazer, não só o que houve. -->
  @if (advice(); as text) {
    <p class="advice">{{ text }}</p>
  }
</div>

<div class="actions">
  <ng-content />
</div>
