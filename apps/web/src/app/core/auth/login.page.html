<main class="login">
  <h1 i18n="@@auth.login.title">Entrar</h1>
  <p class="lead" i18n="@@auth.login.lead">Entre com o e-mail e a senha da sua conta UniOver.</p>

  <form (submit)="submit($event)" novalidate>
    <div class="field">
      <label for="login-email" i18n="@@auth.login.email">E-mail</label>
      <input
        #emailField
        id="login-email"
        name="email"
        type="email"
        autocomplete="username"
        [attr.inputmode]="'email'"
        [attr.autocapitalize]="'none'"
        spellcheck="false"
        required
        [value]="email()"
        (input)="setEmail($event)"
      />
    </div>

    <div class="field">
      <label for="login-password" i18n="@@auth.login.password">Senha</label>
      <div class="password">
        <input
          id="login-password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          required
          [value]="password()"
          (input)="setPassword($event)"
        />
        <button
          type="button"
          class="toggle"
          [attr.aria-pressed]="showPassword()"
          (click)="toggleShowPassword()"
          i18n="@@auth.login.show-password"
        >
          Mostrar senha
        </button>
      </div>
    </div>

    <div class="messages" [attr.aria-live]="'polite'">
      @if (errorText(); as message) {
        <p #errorBox class="error" role="alert" tabindex="-1">
          {{ message }}
          @if (blocked()) {
            <span aria-hidden="true" i18n="@@auth.login.wait"
              >Tente de novo em {{ waitSeconds() }} s.</span
            >
          }
        </p>
      }
    </div>

    <button type="submit" class="submit" [disabled]="busy() || blocked()">
      @if (busy()) {
        <span i18n="@@auth.login.busy">Entrando…</span>
      } @else {
        <span i18n="@@auth.login.submit">Entrar</span>
      }
    </button>
  </form>
</main>
