@if (loading()) {
  <app-settings-page-skeleton kind="list" marker="settings" label="Carregando Configurações…" i18n-label="@@settings.loading" />
} @else {
<!-- Uma linha que leva a uma tela: ladrilho, nome e a seta (sem subtítulo). A linha da tela aberta recebe aria-current. -->
<ng-template #row let-entry>
  <a
    class="ui-row"
    [routerLink]="entry.link"
    [routerLinkActive]="'active'"
    [ariaCurrentWhenActive]="'page'"
  >
    <span class="ui-tile"><app-settings-glyph [name]="entry.glyph" /></span>
    <span class="ui-row-text">
      <span class="ui-row-title">{{ entry.title }}</span>
    </span>
    <app-settings-glyph class="chev" name="chevron" />
  </a>
</ng-template>

<div class="settings ui-stagger" data-screen-ready="settings">
  <app-theme-segment class="ui-rise" />

  <section class="section ui-rise" aria-labelledby="personal-title">
    <h2 id="personal-title" class="ui-section-label" i18n="@@settings.list.personal">Você</h2>
    <ul class="ui-group">
      @for (entry of personal(); track entry.id) {
        <li>
          <ng-container [ngTemplateOutlet]="row" [ngTemplateOutletContext]="{ $implicit: entry }" />
        </li>
      }
    </ul>
  </section>

  @if (administration().length > 0) {
    <section class="section ui-rise" aria-labelledby="admin-title">
      <h2 id="admin-title" class="ui-section-label" i18n="@@settings.list.administration">
        Administração
      </h2>
      <ul class="ui-group">
        @for (entry of administration(); track entry.id) {
          <li>
            <ng-container
              [ngTemplateOutlet]="row"
              [ngTemplateOutletContext]="{ $implicit: entry }"
            />
          </li>
        }
      </ul>
    </section>
  }

  <section class="section ui-rise" aria-labelledby="app-title">
    <h2 id="app-title" class="ui-section-label" i18n="@@settings.list.app">Aplicativo</h2>
    <ul class="ui-group">
      <li>
        <ng-container [ngTemplateOutlet]="row" [ngTemplateOutletContext]="{ $implicit: about }" />
      </li>
    </ul>
  </section>
</div>
}
