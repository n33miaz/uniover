<div class="picker">
  <fieldset class="models">
    <legend class="legend" i18n="@@settings.people.models-title">Modelos prontos</legend>
    <div class="chips">
      @for (model of models; track model) {
        <label class="model" [class.on]="mode() === model">
          <input
            type="radio"
            class="ui-visually-hidden"
            [name]="modelGroup"
            [value]="model"
            [checked]="mode() === model"
            (change)="pickModel(model)"
          />
          <span>{{ modelText(model) }}</span>
        </label>
      }
    </div>
  </fieldset>

  <fieldset class="group">
    <legend class="legend">
      <span class="legend-in">
        <app-settings-glyph name="tv" />
        <span i18n="@@settings.people.group-tv">TV</span>
      </span>
    </legend>
    <ul class="ui-group switches">
      @for (permission of tvOptions; track permission) {
        <li>
          <label class="option" [class.sub]="permission !== tvModule">
            <span class="option-text">
              <span class="option-title">{{ optionText(permission) }}</span>
              @if (permission === tvModule) {
                <span class="option-sub" i18n="@@settings.people.option.tv-view-hint"
                  >Sem isso, nada da TV aparece.</span
                >
              }
            </span>
            <input
              type="checkbox"
              role="switch"
              class="ui-switch"
              [checked]="has(permission)"
              (change)="toggle(permission, $event)"
            />
          </label>
        </li>
      }
    </ul>
  </fieldset>

  <fieldset class="group">
    <legend class="legend">
      <span class="legend-in">
        <app-settings-glyph name="dumbbell" />
        <span i18n="@@settings.people.group-training">Treino</span>
      </span>
    </legend>
    <ul class="ui-group switches">
      <li>
        <label class="option">
          <span class="option-text">
            <span class="option-title">{{ optionText(trainingModule) }}</span>
          </span>
          <input
            type="checkbox"
            role="switch"
            class="ui-switch"
            [checked]="has(trainingModule)"
            (change)="toggle(trainingModule, $event)"
          />
        </label>
      </li>
    </ul>
  </fieldset>

  @if (showSummary()) {
    <p class="summary ui-notice" [class.warn]="!valid()" role="status">
      @if (valid()) {
        <span class="summary-text">
          <strong i18n="@@settings.people.summary-label">Poderá:</strong> {{ summary() }}
        </span>
      } @else {
        <span class="summary-text">{{ summary() }}</span>
      }
    </p>
  }
</div>
