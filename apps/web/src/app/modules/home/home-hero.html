<header class="hero ui-rise">
  <app-home-glyph class="scene" [name]="dayPart()" />
  <div class="hero-text">
    @if (loading()) {
      <span appSkeleton class="date-skeleton"></span>
      <span appSkeleton class="greeting-skeleton"></span>
    } @else {
      <p class="date">{{ dateLabel() }}</p>
      <h1>{{ greeting() }}</h1>
    }
  </div>
</header>
