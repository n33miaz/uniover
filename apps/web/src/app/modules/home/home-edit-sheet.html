<dialog #dialog class="sheet ui-dialog" aria-labelledby="sheet-title" (cancel)="cancel($event)">
  <span class="grabber" aria-hidden="true"></span>
  <header class="head">
    <h2 id="sheet-title" i18n="@@home.sheet.title">Editar a Início</h2>
  </header>

  <ul class="rows">
    @for (item of draft(); track item.id; let first = $first; let last = $last) {
      <li
        class="row"
        [attr.data-id]="item.id"
        [class.dragging]="dragging() === item.id"
        [class.off]="!item.enabled"
      >
        <span
          class="grip"
          aria-hidden="true"
          (pointerdown)="startDrag($event, item.id)"
          (pointermove)="dragOver($event)"
          (pointerup)="endDrag()"
          (pointercancel)="endDrag()"
          ><app-home-glyph name="grip"
        /></span>
        <span class="ico ui-tile"><app-home-glyph [name]="glyph(item.id)" /></span>
        <span class="name">{{ title(item.id) }}</span>

        <div class="moves">
          <button
            type="button"
            class="icon-button up"
            [disabled]="first"
            [attr.aria-label]="upLabel(item.id)"
            (click)="move(item.id, -1)"
          >
            <app-home-glyph name="up" />
          </button>
          <button
            type="button"
            class="icon-button down"
            [disabled]="last"
            [attr.aria-label]="downLabel(item.id)"
            (click)="move(item.id, 1)"
          >
            <app-home-glyph name="down" />
          </button>
        </div>

        <label class="show">
          <input
            type="checkbox"
            role="switch"
            class="ui-switch"
            [attr.aria-label]="showLabel(item.id)"
            [checked]="item.enabled"
            (change)="setEnabled(item.id, $any($event.target).checked)"
          />
        </label>
      </li>
    }
  </ul>

  <div class="footer">
    <button type="button" class="secondary ui-btn" (click)="cancel()" i18n="@@home.sheet.cancel">
      Cancelar
    </button>
    <button type="button" class="primary ui-btn" (click)="apply()" i18n="@@home.sheet.apply">
      Aplicar
    </button>
  </div>
</dialog>
