<app-progress-section [heading]="heading" [summary]="summary" [glyph]="'download'" [(open)]="open">
  <ul class="list ui-plain">
    @for (row of rows(); track row.action) {
      <li>
        <button
          type="button"
          class="ui-row"
          [disabled]="row.state.kind === 'busy'"
          [attr.aria-describedby]="row.action + '-status'"
          (click)="run(row.action)"
        >
          <span class="ui-tile"><app-progress-glyph [name]="row.glyph" /></span>
          <span class="ui-row-text">
            <span class="ui-row-title">{{ row.title }}</span>
            <span class="ui-row-sub">{{ row.sub }}</span>
          </span>
        </button>
        <p
          class="status"
          [id]="row.action + '-status'"
          [class.error]="row.state.kind === 'error'"
          role="status"
        >
          {{ row.state.text }}
        </p>
      </li>
    }
  </ul>

  <p class="note" i18n="@@training.progress.export.note">
    Seus dados moram no aparelho e sobem para a nuvem quando há internet. A exportação é o seguro
    extra contra o navegador apagar dados de site.
  </p>
</app-progress-section>
