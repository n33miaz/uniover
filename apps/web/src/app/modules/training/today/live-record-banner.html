<div class="record" role="status">
  <div class="record-head">
    <app-today-glyph class="star" name="star" />
    <p class="record-title" i18n="@@training.live.record-title">Recorde!</p>
    <button
      type="button"
      class="icon small ui-tap"
      [attr.aria-label]="dismissLabel"
      (click)="dismissed.emit()"
    >
      <app-training-glyph name="close" />
    </button>
  </div>
  @for (line of lines(); track line) {
    <p class="record-line">{{ line }}</p>
  }
</div>
