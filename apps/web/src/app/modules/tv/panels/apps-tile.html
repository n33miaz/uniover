@let s = shortcut();
@if (managing()) {
  <div class="face">
    <span class="art">
      <app-tv-app-icon [shortcut]="s" [lazy]="true" />
      @if (s.enabled) {
        <span class="mark" aria-hidden="true"><app-tv-pin [filled]="true" /></span>
      }
    </span>
    <span class="text">
      <span class="name">{{ name() }}</span>
      <span class="package">{{ s.package }}</span>
    </span>
  </div>
  @if (rank()) {
    <div class="moves">
      <button
        type="button"
        class="move"
        [attr.data-move]="'left'"
        [attr.data-for]="s.id"
        [attr.aria-label]="moveLeftLabel()"
        [attr.aria-disabled]="atStart() ? 'true' : null"
        (click)="onMove(-1)"
      >
        <app-tv-icon name="left" />
      </button>
      <button
        type="button"
        class="move"
        [attr.data-move]="'right'"
        [attr.data-for]="s.id"
        [attr.aria-label]="moveRightLabel()"
        [attr.aria-disabled]="atEnd() ? 'true' : null"
        (click)="onMove(1)"
      >
        <app-tv-icon name="right" />
      </button>
    </div>
  }
  <div class="tools">
    <button
      type="button"
      class="tool pin"
      [class.on]="s.enabled"
      [attr.aria-label]="toggleLabel()"
      [attr.aria-disabled]="busy() ? 'true' : null"
      (click)="pin.emit(s)"
    >
      <app-tv-pin [filled]="s.enabled" />
    </button>
    <button
      type="button"
      class="tool"
      [attr.aria-label]="renameLabel()"
      [attr.data-rename]="s.id"
      (click)="rename.emit(s)"
    >
      <app-tv-icon name="rename" />
    </button>
  </div>
} @else {
  @if (launchable()) {
    <button
      type="button"
      class="launch"
      [disabled]="!canSend() || !s.installed"
      [attr.aria-describedby]="marked() && s.enabled ? describedBy() : null"
      (click)="launch.emit(s)"
    >
      <span class="art">
        <app-tv-app-icon [shortcut]="s" [lazy]="true" />
        @if (marked() && s.enabled) {
          <span class="mark" aria-hidden="true"><app-tv-pin [filled]="true" /></span>
        }
      </span>
      <span class="name">{{ name() }}</span>
    </button>
  } @else {
    <!-- Sem permissão para abrir apps: a mesma figura e o mesmo nome, sem botão (a marca "No controle" é lida logo depois). -->
    <div class="launch still">
      <span class="art">
        <app-tv-app-icon [shortcut]="s" [lazy]="true" />
        @if (marked() && s.enabled) {
          <span class="mark" aria-hidden="true"><app-tv-pin [filled]="true" /></span>
        }
      </span>
      <span class="name">{{ name() }}</span>
    </div>
  }
  @if (marked() && s.enabled) {
    <span class="sr" [id]="describedBy()" i18n="@@tv.apps.in-control">No controle</span>
  }
}
