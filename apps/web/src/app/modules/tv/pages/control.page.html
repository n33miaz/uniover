<section class="remote" [style.--key-scale]="prefs.keyScale()">
  <app-tv-shortcut-row
    [shortcuts]="shortcuts()"
    [canSend]="store.canSend()"
    (open)="openShortcut($event)"
  />

  <!--
    Só este bloco troca de página: as direções com o OK, os números e, por último, o touchpad. Tudo o mais (atalhos, pílulas,
    botões redondos) fica parado, dentro e fora do gesto.
  -->
  <div class="stage">
    <div class="viewport">
      <div
        #pager
        class="pager"
        tabindex="0"
        role="group"
        aria-label="Direções, números e touchpad"
        i18n-aria-label="@@tv.stage.label"
        (scroll)="onScroll()"
        (keydown)="onKey($event)"
      >
        <div
          class="panel"
          role="group"
          [attr.aria-label]="pageLabel(0)"
          [attr.inert]="page() === 0 ? null : ''"
        >
          <app-directional-ring />
        </div>

        <div
          class="panel"
          role="group"
          [attr.aria-label]="pageLabel(1)"
          [attr.inert]="page() === 1 ? null : ''"
        >
          <app-number-pad />
        </div>

        <div
          class="panel touch"
          role="group"
          [attr.aria-label]="pageLabel(2)"
          [attr.inert]="page() === 2 ? null : ''"
        >
          <span class="edge" aria-hidden="true"></span>
          <app-touchpad-surface />
        </div>
      </div>
    </div>

    <app-page-dots
      [current]="page()"
      [progress]="progress()"
      [count]="pageCount"
      (choose)="goTo($event)"
    />
  </div>

  <div class="bottom" [class.no-channel]="!prefs.showChannel()">
    <div
      class="pill volume"
      role="group"
      aria-label="Volume"
      i18n-aria-label="@@tv.volume.label"
      [style.--level]="volumePercent() + '%'"
    >
      <button
        type="button"
        class="pill-btn"
        [appKey]="'VOLUME_UP'"
        [repeat]="true"
        aria-label="Aumentar o volume"
        i18n-aria-label="@@tv.key.volume-up"
      >
        <app-tv-icon name="plus" />
      </button>
      <span class="level" role="img" [attr.aria-label]="volumeLabel()">
        <span class="cap" aria-hidden="true" i18n="@@tv.volume.cap">VOL</span>
        <strong aria-hidden="true">{{ volumeText() }}</strong>
      </span>
      <button
        type="button"
        class="pill-btn"
        [appKey]="'VOLUME_DOWN'"
        [repeat]="true"
        aria-label="Diminuir o volume"
        i18n-aria-label="@@tv.key.volume-down"
      >
        <app-tv-icon name="minus" />
      </button>
    </div>

    <div class="round-grid" [attr.data-cols]="roundColumns()">
      <button
        type="button"
        class="round"
        [appKey]="'BACK'"
        aria-label="Voltar"
        i18n-aria-label="@@tv.key.back"
      >
        <app-tv-icon name="back" />
      </button>
      <button
        type="button"
        class="round"
        [appKey]="'HOME'"
        aria-label="Início da TV"
        i18n-aria-label="@@tv.key.home"
      >
        <app-tv-icon name="home" />
      </button>
      <button
        type="button"
        class="round"
        [appKey]="'MENU'"
        aria-label="Menu"
        i18n-aria-label="@@tv.key.menu"
      >
        <app-tv-icon name="menu" />
      </button>
      <button
        type="button"
        class="round"
        [attr.aria-haspopup]="'dialog'"
        aria-label="Teclado"
        i18n-aria-label="@@tv.key.keyboard"
        (click)="askKeyboard($event)"
      >
        <app-tv-icon name="keyboard" />
      </button>
      @if (prefs.showMedia()) {
        <button
          type="button"
          class="round"
          [appKey]="'MEDIA_PREVIOUS'"
          aria-label="Anterior"
          i18n-aria-label="@@tv.key.previous"
        >
          <app-tv-icon name="previous" />
        </button>
        <button
          type="button"
          class="round"
          [appKey]="'PLAY_PAUSE'"
          aria-label="Reproduzir ou pausar"
          i18n-aria-label="@@tv.key.play-pause"
        >
          <app-tv-icon name="play-pause" />
        </button>
        <button
          type="button"
          class="round"
          [appKey]="'MEDIA_NEXT'"
          aria-label="Próxima"
          i18n-aria-label="@@tv.key.next"
        >
          <app-tv-icon name="next" />
        </button>
        <button
          type="button"
          class="round"
          [appKey]="'MUTE'"
          aria-label="Mudo"
          i18n-aria-label="@@tv.key.mute"
        >
          <app-tv-icon name="mute" />
        </button>
      }
    </div>

    @if (prefs.showChannel()) {
      <div class="pill" role="group" aria-label="Canal" i18n-aria-label="@@tv.channel.label">
        <button
          type="button"
          class="pill-btn"
          [appKey]="'CHANNEL_UP'"
          aria-label="Próximo canal"
          i18n-aria-label="@@tv.key.channel-up"
        >
          <app-tv-icon name="up" />
        </button>
        <span class="level" aria-hidden="true">
          <span class="cap" i18n="@@tv.channel.cap">CH</span>
        </span>
        <button
          type="button"
          class="pill-btn"
          [appKey]="'CHANNEL_DOWN'"
          aria-label="Canal anterior"
          i18n-aria-label="@@tv.key.channel-down"
        >
          <app-tv-icon name="down" />
        </button>
      </div>
    }
  </div>
</section>
