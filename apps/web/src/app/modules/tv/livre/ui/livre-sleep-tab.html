<button
  type="button"
  class="sleep ui-btn primary block"
  [disabled]="!idle()"
  [attr.aria-busy]="sleeping()"
  (click)="store.sleep()"
>
  @if (sleeping()) {
    <span class="ui-spinner" aria-hidden="true"></span>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path [attr.d]="'M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z'" />
    </svg>
  }
  <span i18n="@@tv-livre.sleep.button">Modo Dormir</span>
</button>

@if (store.launcherExtras()) {
  <p class="hint" i18n="@@tv-livre.sleep.hint-keys">
    Qualquer tecla do controle acorda a TV, menos volume e mídia.
  </p>
} @else {
  <p class="hint" i18n="@@tv-livre.sleep.hint">Qualquer tecla do controle acorda a TV.</p>
}

<section class="time">
  <h2 class="label" i18n="@@tv-livre.sleep.max-label">Acordar Sozinho</h2>
  <app-livre-sleep-time />
</section>
