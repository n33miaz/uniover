<section class="pairing" aria-labelledby="tv-pairing-title">
  <h2 id="tv-pairing-title" i18n="@@tv.not-paired.title">TV não pareada</h2>
  <p i18n="@@tv.not-paired.body">Sem pareamento válido com a TV.</p>
  @if (owner()) {
    <button
      type="button"
      class="pairing-action ui-btn primary"
      (click)="pair.emit()"
      i18n="@@tv.not-paired.action"
    >
      Parear de novo
    </button>
  } @else {
    <p i18n="@@tv.not-paired.guest">Peça a quem administra o app para parear a TV.</p>
  }
</section>
