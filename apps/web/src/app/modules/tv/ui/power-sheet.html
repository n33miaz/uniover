<dialog
  #dialog
  class="sheet"
  aria-labelledby="power-title"
  aria-describedby="power-text"
  (cancel)="cancel($event)"
>
  <h2 id="power-title" i18n="@@tv.power.title">Desligar a TV?</h2>
  <p id="power-text" class="text" i18n="@@tv.power.text">
    Sem o emissor infravermelho, a TV só volta com o controle original.
  </p>

  @if (error(); as text) {
    <p class="error" role="alert">{{ text }}</p>
  }

  <div class="footer">
    <button
      type="button"
      class="secondary"
      [disabled]="busy()"
      (click)="cancel()"
      i18n="@@tv.power.cancel"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="danger"
      [disabled]="busy() || !store.canSend()"
      (click)="confirm()"
      i18n="@@tv.power.confirm"
    >
      Desligar
    </button>
  </div>
</dialog>
