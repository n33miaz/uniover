<dialog
  #dialog
  class="sheet"
  aria-labelledby="power-title"
  aria-describedby="power-text"
  (cancel)="cancel($event)"
>
  <h2 id="power-title" i18n="@@tv.power.title">Desligar a TV?</h2>
  <p id="power-text" class="text" i18n="@@tv.power.text">
    Sem o emissor infravermelho, a TV só volta com o controle original.
  </p>

  <!-- Ainda não existe no agente: é só um aviso do que vem, por isso não é botão. -->
  <div
    class="ui-group schedule"
    role="group"
    aria-labelledby="power-schedule-title"
    aria-describedby="power-schedule-note"
    aria-disabled="true"
  >
    <div class="ui-row">
      <span class="ui-tile"><app-tv-icon name="clock" /></span>
      <span class="ui-row-text">
        <span id="power-schedule-title" class="ui-row-title" i18n="@@tv.power.schedule"
          >Agendar desligamento</span
        >
      </span>
      <span class="ui-chip" i18n="@@tv.power.soon">Em breve</span>
    </div>
    <span id="power-schedule-note" class="sr-only" i18n="@@tv.power.schedule-note"
      >Ainda não disponível.</span
    >
  </div>

  @if (error(); as text) {
    <p class="error" role="alert">{{ text }}</p>
  }

  <div class="footer">
    <button
      type="button"
      class="secondary"
      [disabled]="busy()"
      (click)="cancel()"
      i18n="@@tv.power.cancel"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="danger"
      [disabled]="busy() || !store.canSend()"
      (click)="confirm()"
      i18n="@@tv.power.confirm"
    >
      Desligar
    </button>
  </div>
</dialog>
