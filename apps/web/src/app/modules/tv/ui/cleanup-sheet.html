<dialog
  #dialog
  class="sheet"
  aria-labelledby="cleanup-title"
  aria-describedby="cleanup-text"
  (cancel)="cancel($event)"
>
  <h2 id="cleanup-title" i18n="@@tv.cleanup.title">Limpar a TV?</h2>
  @if (closesBackground()) {
    <p id="cleanup-text" class="text" i18n="@@tv.cleanup.text-closing">
      Fecha os apps em segundo plano e libera memória. O app que está passando agora continua
      aberto, e a conexão com o controle também.
    </p>
  } @else {
    <p id="cleanup-text" class="text" i18n="@@tv.cleanup.text">
      Libera memória sem fechar nenhum app. A conexão com o controle continua.
    </p>
  }

  <div class="footer">
    <button type="button" class="secondary" (click)="cancel()" i18n="@@tv.cleanup.cancel">
      Cancelar
    </button>
    <button
      type="button"
      class="primary"
      [disabled]="!store.canSend()"
      (click)="confirm()"
      i18n="@@tv.cleanup.confirm"
    >
      Limpar
    </button>
  </div>
</dialog>
