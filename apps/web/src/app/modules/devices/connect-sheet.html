<dialog #dialog class="sheet ui-dialog" aria-labelledby="connect-title" (cancel)="close($event)">
  <span class="grabber" aria-hidden="true"></span>
  <h2 id="connect-title" i18n="@@devices.connect.title">Conectar este PC</h2>

  <ol class="steps">
    <li i18n="@@devices.connect.step-download">Baixar e abrir o conector</li>
    <li i18n="@@devices.connect.step-scan">Escanear o QR com o celular</li>
    <li i18n="@@devices.connect.step-accept">Aceitar na TV</li>
  </ol>

  <div class="footer">
    <button type="button" class="secondary ui-btn" (click)="close()" i18n="@@devices.connect.close">
      Fechar
    </button>
    <a
      class="download primary ui-btn"
      [attr.href]="connectorUrl"
      download="conectar-uniover.cmd"
      i18n-download="@@devices.connect.download-file"
      i18n="@@devices.connect.download"
      >Baixar conector</a
    >
  </div>
</dialog>
