    <!--
      Escolhe o desenho antes de baixar qualquer pacote do app. O nonce é o mesmo que o servidor põe na CSP desta
      resposta; assim este trecho pequeno não abre exceção para scripts em linha e não deixa a primeira pintura esperar
      a rede.
    -->
    <script nonce="__CSP_NONCE__">
      (function () {
        var p = location.pathname;
        var v = 'detail';
        if (p === '/' || p === '/index.html') v = 'home';
        else if (/^\/tv(\/|$)/.test(p)) v = 'tv';
        else if (/^\/treino\/(exercicios|rotinas)(\/|$)/.test(p)) v = 'training-list';
        else if (/^\/treino\/progresso(\/|$)/.test(p)) v = 'training-progress';
        else if (/^\/treino\/corpo(\/|$)/.test(p)) v = 'training-body';
        else if (/^\/treino(\/|$)/.test(p)) v = 'training-today';
        else if (/^\/ajustes\/?$/.test(p)) v = 'settings';
        else if (/^\/ajustes\/sistema(\/|$)/.test(p)) v = 'settings-system';
        else if (/^\/ajustes\/pessoas(\/|$)/.test(p)) v = 'settings-people';
        else if (/^\/ajustes\/auditoria(\/|$)/.test(p)) v = 'settings-audit';
        else if (/^\/ajustes\/(dispositivos|aparelhos)(\/|$)/.test(p)) v = 'settings-devices';
        else if (/^\/ajustes\/perfil(\/|$)/.test(p)) v = 'settings-profile';
        else if (/^\/ajustes\/aparencia(\/|$)/.test(p)) v = 'settings-appearance';
        else if (/^\/ajustes\//.test(p)) v = 'detail';
        else if (/^\/(entrar|convite|boas-vindas|conectar)(\/|$)/.test(p)) v = 'plain';
        document.documentElement.setAttribute('data-boot', v);
        setTimeout(function () {
          var el = document.getElementById('boot-skeleton');
          var notice = document.getElementById('boot-timeout');
          if (el) el.setAttribute('data-boot-timeout', 'true');
          if (notice) notice.hidden = false;
        }, 20000);
        document.addEventListener('click', function (event) {
          if (event.target && event.target.id === 'boot-timeout-retry') location.reload();
        });
      })();
    </script>
