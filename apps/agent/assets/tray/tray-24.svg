<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" shape-rendering="crispEdges">
<!-- Versão de 24 px (bandeja a 150%): uma unidade é um pixel, as ondas são degraus de 2 px e o selo tem centro em pixel,
     para nada cair entre duas linhas da grade. Mesmas trocas de cor e de selo do desenho mestre. -->
  <circle cx="12" cy="12" r="12" fill="#1F8A4C" shape-rendering="geometricPrecision"/>
  <circle cx="12" cy="12" r="3" fill="#FFFFFF" shape-rendering="geometricPrecision"/>
  <g fill="#FFFFFF">
    <rect x="17" y="9" width="2" height="6"/>
    <rect x="16" y="8" width="2" height="1"/>
    <rect x="15" y="7" width="2" height="1"/>
    <rect x="16" y="15" width="2" height="1"/>
    <rect x="15" y="16" width="2" height="1"/>
    <rect x="5" y="9" width="2" height="6"/>
    <rect x="6" y="8" width="2" height="1"/>
    <rect x="7" y="7" width="2" height="1"/>
    <rect x="6" y="15" width="2" height="1"/>
    <rect x="7" y="16" width="2" height="1"/>
  </g>
  <g id="attention">
    <circle cx="18.5" cy="18.5" r="5.5" fill="#FFFFFF" shape-rendering="geometricPrecision"/>
    <circle cx="18.5" cy="18.5" r="4.5" fill="#D92D20" shape-rendering="geometricPrecision"/>
    <rect x="18" y="15" width="1" height="4" fill="#FFFFFF"/>
    <rect x="18" y="20" width="1" height="1" fill="#FFFFFF"/>
  </g>
</svg>
