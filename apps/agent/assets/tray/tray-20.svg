<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" shape-rendering="crispEdges">
<!-- Versão de 20 px (bandeja a 125%): mesma ideia da de 24 px, redesenhada na grade de 20. Sem o "!" no selo: com 7 px
     de largura ele viraria um borrão, e a cor do selo já basta. -->
  <circle cx="10" cy="10" r="10" fill="#1F8A4C" shape-rendering="geometricPrecision"/>
  <circle cx="10" cy="10" r="3" fill="#FFFFFF" shape-rendering="geometricPrecision"/>
  <g fill="#FFFFFF">
    <rect x="14" y="7" width="2" height="6"/>
    <rect x="13" y="6" width="2" height="1"/>
    <rect x="12" y="5" width="2" height="1"/>
    <rect x="13" y="13" width="2" height="1"/>
    <rect x="12" y="14" width="2" height="1"/>
    <rect x="4" y="7" width="2" height="6"/>
    <rect x="5" y="6" width="2" height="1"/>
    <rect x="6" y="5" width="2" height="1"/>
    <rect x="5" y="13" width="2" height="1"/>
    <rect x="6" y="14" width="2" height="1"/>
  </g>
<!-- O anel do selo tem a cor do disco e é cortado pelo disco (clipPath): sobre a marca abre um vão, como um recorte, em vez de
     um anel branco que se juntaria à onda e viraria um gancho; fora do disco não há anel. -->
  <clipPath id="disc"><circle cx="10" cy="10" r="10"/></clipPath>
  <g id="attention">
    <circle cx="15.5" cy="15.5" r="4.5" fill="#1F8A4C" clip-path="url(#disc)" shape-rendering="geometricPrecision"/>
    <circle cx="15.5" cy="15.5" r="3.5" fill="#FF5C45" shape-rendering="geometricPrecision"/>
  </g>
</svg>
