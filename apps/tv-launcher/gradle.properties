# Memória curta na máquina de desenvolvimento: um daemon pequeno e o compilador do Kotlin no mesmo processo.
org.gradle.jvmargs=-Xmx768m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.caching=false
# O app em si não usa AndroidX (o APK não leva nenhuma dependência); a chave existe só porque o Robolectric, nos
# testes, traz bibliotecas AndroidX e o Gradle exige a opção ligada para montar o manifesto de teste.
android.useAndroidX=true
android.nonTransitiveRClass=true
